function intro(title,subtitle,eyebrow='SEU INGLÊS, UM PASSO À FRENTE'){return `<div class="intro"><div><div class="eyebrow muted">${eyebrow}</div><h1>${title}</h1><p>${subtitle}</p></div><span class="pill"><span class="dot"></span>Feito para a vida real</span></div>`;}
function hero(){const n=nextTask(),u=UNITS[n.unit];let title,desc,button,tag;
 if(n.mode==='placement'){tag='O SEU PONTO DE PARTIDA';title='Seu próximo nível<br>começa aqui.';desc='Descubra de onde partir. Uma trilha do A1 ao C2, no seu ritmo e sem enrolação.';button='Descobrir meu nível';}
 else if(n.mode==='resume'){tag='CONTINUE DE ONDE PAROU';title='Um passo a mais.<br>Um mundo mais perto.';desc='Sua sessão está salva. Retome a próxima questão e continue avançando.';button='Retomar sessão';}
 else if(n.mode==='boss'){tag=`DESAFIO ${LEVELS[n.level]}`;title='Hora de conquistar<br>o seu selo.';desc='10 questões, conhecimentos misturados. Acerte 80% para liberar o próximo nível.';button='Começar boss fight';}
 else if(n.mode==='practice'){tag='TRILHA CONCLUÍDA';title='Seu inglês continua<br>em movimento.';desc='Todos os níveis concluídos. Mantenha a precisão com uma prática mista de C2.';button='Praticar mais';}
 else{tag=`${u.level} · UNIDADE ${n.unit%3+1}`;title='Poucos minutos.<br>Progresso de verdade.';desc=u.canDo;button='Continuar aprendendo';}
 return `<section class="hero"><div class="hero-copy"><div class="eyebrow">${tag}</div><h2>${title}</h2><p>${desc}</p><button class="btn" data-action="next">${button}${icon('arrow')}</button><div class="tiny muted" style="margin-top:12px">${n.mode==='placement'?'Até 15 questões · nivelamento adaptativo':n.mode==='boss'?'10 questões · +50 XP ao conquistar o selo':'Uma questão por vez · cerca de 3 min'}</div></div><div class="hero-art" aria-hidden="true"><div class="orbit"></div><div class="orbit two"></div><div class="letter-tile">A</div><div class="letter-tile second">a</div><div class="art-spark">✦</div></div></section>`;
}
function dailyCard(){const today=dayKey(),xp=state.daily[today]||0,p=Math.min(1,xp/state.goal),names=['D','S','T','Q','Q','S','S'];const days=Array.from({length:7},(_,i)=>{const d=new Date();d.setHours(12);d.setDate(d.getDate()-6+i);const k=dayKey(d);return `<div class="day">${names[d.getDay()]}<span class="${state.days[k]?'on':''} ${k===today?'today':''}" title="${k}: ${state.days[k]?'praticou':'sem prática'}">${state.days[k]?'✓':d.getDate()}</span></div>`;}).join('');return `<section class="card"><div class="daily-head"><h3>Sua meta de hoje</h3>${icon('target')}</div><div class="big-number">${xp}<span> / ${state.goal} XP</span></div>${bar(p,p===1)}<div class="daily-foot"><span>${p===1?'Meta concluída':'Cada resposta faz diferença'}</span><strong>${Math.round(p*100)}%</strong></div><div class="weekly">${days}</div></section>`;}
function rail(){return `<aside class="stack right-rail">${dailyCard()}<section class="card side-callout"><div class="icon-square">${icon('book')}</div><h3>Errar também é avançar.</h3><p>${Object.keys(state.errors).length?`${Object.keys(state.errors).length} pontos para revisar. Transforme os erros de hoje em acertos amanhã.`:'Seu caderno guarda o que merece mais atenção. Você pratica; a gente organiza.'}</p><button class="text-btn" data-nav="review">Abrir caderno ${icon('arrow')}</button></section><section class="card"><div class="daily-head"><h3>Seu passaporte</h3>${icon('shield')}</div><p class="tiny muted" style="margin-top:9px">Um desafio. Um nível conquistado.</p><div class="stamps">${LEVELS.map((l,i)=>`<span class="stamp ${state.bosses[i]?'earned':''}" title="${l}: ${state.bosses[i]?'selo conquistado':levelComplete(i)?'dispensado pelo nivelamento':'selo ainda não conquistado'}">${l}</span>`).join('')}</div></section></aside>`;}
function pathCard(){const li=selectedLevel,start=li*3,done=UNITS.slice(start,start+3).filter(u=>mastered(u.id)).length,open=unlocked(li),n=nextTask();return `<div class="section-heading"><h2>Sua trilha de aprendizado</h2><span class="tiny">18 unidades · 6 níveis</span></div><div class="level-tabs" role="group" aria-label="Níveis CEFR">${LEVELS.map((l,i)=>`<button class="level-tab ${selectedLevel===i?'selected':''} ${unlocked(i)?'':'locked'}" data-level="${i}" aria-pressed="${selectedLevel===i}">${l}${levelComplete(i)?icon('check'):unlocked(i)?'':icon('lock')}</button>`).join('')}</div><section class="card level-card"><div class="level-head"><div><h3>${LEVELS[li]} · ${LEVEL_NAMES[li]}</h3><p>${done} de 3 unidades concluídas</p></div><span class="level-tag">${levelComplete(li)?'Concluído':open?'Em movimento':'A desbloquear'}</span></div><div class="unit-list">${UNITS.slice(start,start+3).map((u,j)=>{const done=mastered(u.id),available=unitUnlocked(u.id),current=n.unit===u.id&&!done;return `<div class="unit-row ${done?'done':current?'current':available?'':'locked'}"><div class="unit-node">${done?icon('check'):available||state.placement===null?String(j+1).padStart(2,'0'):icon('lock')}</div><div class="unit-text"><h3>${esc(u.title)}</h3><p>${esc(u.canDo)}</p><div class="unit-meta">${bar(state.passes[u.id]/2)}<span>${done?'Concluída':state.passes[u.id]+'/2 sessões aprovadas'}</span></div></div><button class="unit-action" data-unit="${u.id}" aria-label="${available?'Praticar':'Ver como liberar'}: ${esc(u.title)}">${icon(available?'arrow':'lock')}</button></div>`;}).join('')}<div class="unit-row ${state.bosses[li]?'done':done===3&&open?'current':'locked'}"><div class="unit-node">${icon('trophy')}</div><div class="unit-text"><h3>Boss fight · ${LEVELS[li]}</h3><p>${state.bosses[li]?'Selo conquistado. Você pode praticar novamente.':levelComplete(li)?'Dispensado pelo nivelamento. Conquiste o selo se quiser.':'Reúna o que aprendeu e conquiste seu selo.'}</p><div class="unit-meta">${state.version===2?'6 etapas · mínimo de 80% de precisão':'10 questões · mínimo de 8 acertos'}</div></div><button class="unit-action" data-boss="${li}" aria-label="Desafio ${LEVELS[li]}">${icon(done===3&&open?'arrow':'lock')}</button></div></div></section>`;}
function renderHome(){const placed=state.placement!==null;$('#app').innerHTML=intro(placed?'Seu próximo passo está aqui.':'Um novo jeito de ir além.',placed?'Continue sua trilha. Seu progresso de ontem é o ponto de partida de hoje.':'Inglês útil. Prática de verdade. Do primeiro “hello” à sua próxima conquista.')+`<div class="grid"><div>${hero()}${pathCard()}</div>${rail()}</div><div class="footer-note">${icon('shield')}Sem vidas, sem anúncios. Só você e o seu progresso.</div>`;}
function renderPath(){$('#app').innerHTML=intro('Do primeiro passo ao domínio.','Uma habilidade concreta por unidade. Dois treinos aprovados para avançar.','SUA TRILHA CEFR')+`<div class="grid"><div>${pathCard()}</div><div class="stack">${dailyCard()}<div class="card"><h3>Sempre um próximo passo.</h3><p class="muted tiny" style="margin:10px 0 18px">Acerte ao menos 4 de 6 em duas sessões para dominar uma unidade.</p><button class="btn full" data-action="next">Próximo passo${icon('arrow')}</button></div></div></div>`;}
function renderNotebook(){const errors=Object.entries(state.errors).sort((a,b)=>b[1].count-a[1].count);$('#app').innerHTML=intro('O que merece outra tentativa.','Revise os pontos mais frequentes. Cada acerto reduz uma ocorrência.','CADERNO DE ERROS')+(errors.length?`<div class="button-row"><button class="btn" data-action="review">Revisar ${Math.min(8,errors.length)} questões${icon('arrow')}</button><span class="pill">${errors.reduce((s,[,v])=>s+v.count,0)} ocorrências · ${errors.length} itens</span></div><div class="error-list">${errors.map(([id,v])=>{const q=BY_ID[id];return `<article class="card error-card"><div class="error-count">${v.count}×</div><div><span class="eyebrow muted">${q.level} · ${esc(UNITS[q.unit].title)}</span><p style="margin-top:8px">${esc(q.prompt)} ${q.context?`<em>${esc(q.context)}</em>`:''}</p><p class="muted">Sua resposta: ${esc(v.answer||'Sem resposta')}</p><p class="error-answer">${esc(q.answers[0])}</p><p class="muted">${esc(q.rule)}</p></div></article>`;}).join('')}</div>`:`<div class="card empty">${icon('book')}<h2>Uma página em branco.</h2><p>Seus erros aparecerão aqui com a correção e a regra.<br>Volte depois de praticar.</p><button class="btn" data-action="next">Ir para o próximo passo${icon('arrow')}</button></div>`);}
function renderSettings(){$('#app').innerHTML=intro('Do seu jeito.','Seu progresso fica neste navegador. Leve uma cópia para outro dispositivo.','PREFERÊNCIAS')+`<div class="settings"><section class="card"><div class="settings-row"><div><h2>Meta diária</h2><p style="margin:0">Uma meta pequena mantém o ritmo.</p></div><label><span class="sr-only">Meta diária de XP</span><select id="daily-goal">${[30,60,100,150].map(n=>`<option value="${n}" ${state.goal===n?'selected':''}>${n} XP / dia</option>`).join('')}</select></label></div></section><section class="card"><h2>Seu progresso vai com você.</h2><p>Exporte um código, guarde uma cópia e importe no outro navegador. O código inclui a sessão em andamento. Importar substitui o progresso deste dispositivo.</p><div class="button-row"><button class="btn secondary" data-action="export">${icon('download')}Gerar código</button><button class="btn secondary" data-action="copy">Copiar código</button></div><label for="save-code" class="question-label">Código de progresso</label><textarea id="save-code" class="code" placeholder="Gere seu código ou cole um código FLUENT2…" spellcheck="false"></textarea><button class="btn" data-action="import">Importar progresso${icon('arrow')}</button><p id="import-status" role="status" style="margin:12px 0 0"></p></section><section class="card"><h2>Como o aprendizado funciona</h2><p>144 exercícios originais · 18 unidades · seis níveis. As sessões priorizam produção e usam no máximo uma questão de múltipla escolha entre seis. O nivelamento testa três questões em cada nível, de A1 a C1: dois acertos liberam o próximo bloco. Passar os cinco blocos encaminha ao C2.</p><p>Os objetivos são adaptações pedagógicas dos descritores CEFR, com a seleção gramatical orientada pelo English Profile. O teste oferece uma estimativa para esta trilha de leitura e escrita; não é uma certificação nem avalia fala ou escuta.</p><p>Respostas aceitam pontuação, contrações, maiúsculas e variantes cadastradas. As tarefas são delimitadas para permitir correção local; formulações livres não cadastradas podem exigir outra redação.</p><div class="source-links"><a href="https://www.coe.int/en/web/common-european-framework-reference-languages/cefr-descriptors" target="_blank" rel="noopener noreferrer">Council of Europe · Descritores CEFR ↗</a><a href="https://www.englishprofile.org/" target="_blank" rel="noopener noreferrer">English Profile · Perfis de uso do inglês ↗</a></div></section><section class="card"><h2>Recomeçar</h2><p>Apaga XP, sequência, unidades, selos e caderno de erros deste navegador. Exporte uma cópia antes de recomeçar.</p><button class="btn danger" data-action="reset">Zerar meu progresso</button></section></div>`;}
function navigate(v){view=v;header();if(v==='home')renderHome();else if(v==='path')renderPath();else if(v==='review')renderNotebook();else if(v==='settings')renderSettings();else if(v==='exercise')renderExercise();else if(v==='summary')renderSummary();$('#app').classList.remove('screen-enter');void $('#app').offsetWidth;$('#app').classList.add('screen-enter');window.scrollTo({top:0,behavior:'instant'});}
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pick(pool,n,maxChoice=1){const a=shuffle(pool).sort((a,b)=>(state.seen[a.id]||0)-(state.seen[b.id]||0));const out=[];let mc=0;for(const q of a){if(q.type==='choice'&&mc>=maxChoice)continue;out.push(q.id);if(q.type==='choice')mc++;if(out.length===n)break;}return out;}
function placementBlock(li){return UNITS.slice(li*3,li*3+3).map(u=>u.items[li%2===0?0:2].id);}
function start(mode,ui=0,li=Math.floor(ui/3)){
 if(state.active){navigate('exercise');return;}
 let ids=[];if(mode==='placement'){li=0;ui=0;ids=placementBlock(0);}else if(mode==='session'){if(!unitUnlocked(ui)){toast('Conclua a etapa anterior para liberar esta unidade.');return;}ids=pick(UNITS[ui].items,6,1);}
 else if(mode==='boss'){if(!unlocked(li)||![0,1,2].every(j=>mastered(li*3+j))){toast('Conclua as três unidades deste nível primeiro.');return;}ids=shuffle(UNITS.slice(li*3,li*3+3).flatMap((u,j)=>pick(u.items,j===0?4:3,1)));}
 else if(mode==='review'){ids=Object.entries(state.errors).sort((a,b)=>b[1].count-a[1].count).slice(0,8).map(([id])=>id);if(!ids.length){navigate('review');return;}ui=BY_ID[ids[0]].unit;li=Math.floor(ui/3);}
 else{ids=pick(ALL.filter(q=>q.level==='C2'),6,1);li=5;ui=17;}
 state.active={mode,unit:ui,level:li,ids,i:0,correct:0,combo:0,xp:0,answers:[],feedback:null,draft:'',bank:[],selected:[],choice:''};state.lastResult=null;prepareQuestion();save();navigate('exercise');
}
function next(){const n=nextTask();if(n.mode==='resume'){navigate('exercise');return;}start(n.mode,n.unit,n.level);}
function prepareQuestion(){const a=state.active;if(!a)return;const q=BY_ID[a.ids[a.i]];a.draft='';a.choice='';a.selected=[];a.bank=q.type==='order'?shuffle(q.answers[0].split(' ')):[];}
const TYPE_NAMES={translate:'Traduza para o inglês',transform:'Transforme a frase',gap:'Complete o contexto',order:'Monte a frase',choice:'Leia e escolha'};
function renderExercise(){const a=state.active;if(!a){navigate('home');return;}const q=BY_ID[a.ids[a.i]],u=UNITS[q.unit],total=a.mode==='placement'?15:a.ids.length,p=(a.i+(a.feedback?1:0))/total;wordSelection=a.selected.slice();const modes={placement:'Nivelamento adaptativo',session:`${u.level} · ${u.title}`,boss:`Boss fight · ${LEVELS[a.level]}`,review:'Revisão dos seus erros',practice:'Prática de manutenção · C2'};
 let field='';if(q.type==='order'){field=`<p class="question-label">Toque nas palavras para montar. Toque novamente para remover.</p><div class="word-zone" id="word-zone" aria-label="Sua frase"></div><div class="word-bank" id="word-bank"></div>`;}else if(q.type==='choice'){field=`<div class="options" role="group" aria-label="Alternativas">${q.options.map((o,i)=>`<button class="option ${a.choice===o?'chosen':''}" data-choice="${i}" ${a.feedback?'disabled':''} aria-pressed="${a.choice===o}"><span class="option-key">${i+1}</span>${esc(o)}</button>`).join('')}</div>`;}else{field=`<label class="question-label" for="answer">${q.type==='gap'?'Escreva apenas o trecho que falta':q.type==='transform'&&q.answers[0].split(' ').length===1?'Escreva a palavra solicitada':'Sua resposta em inglês'}</label><textarea class="question-input" id="answer" lang="en" rows="3" spellcheck="false" autocomplete="off" autocapitalize="off" maxlength="2000" placeholder="Escreva aqui…" ${a.feedback?'disabled':''}>${esc(a.draft)}</textarea>`;}
 const feedback=a.feedback?feedbackHTML(q,a.feedback):'';
 $('#app').innerHTML=`<div class="exercise-wrap"><div class="exercise-top"><button class="icon-btn" data-action="pause" aria-label="Salvar sessão e sair">${icon('close')}</button>${bar(p,p===1,a.i/total)}<span class="tiny muted">${a.i+1} / ${total}${a.mode==='placement'?' máx.':''}</span></div><div class="exercise-info"><span>${esc(modes[a.mode])}</span><span class="combo ${a.combo>=3?'hot':''}">${a.combo>=3?'COMBO '+a.combo+' · +5 XP':'+'+a.xp+' XP nesta sessão'}</span></div>${a.mode==='session'&&a.i===0?`<aside class="lesson"><h3>ANTES DE COMEÇAR · MICROLIÇÃO</h3><p>${esc(u.lesson)}</p><p class="example" lang="en">${esc(u.example)}</p></aside>`:''}<section class="question-card" id="question-card"><div class="eyebrow" style="color:var(--accent)">${q.level} · ${TYPE_NAMES[q.type]}</div><h1 id="question-heading" tabindex="-1">${esc(q.prompt)}</h1>${q.context?`<div class="context" lang="en">${esc(q.context)}</div>`:''}${field}${feedback}<div class="question-actions">${a.feedback?`<span class="keyboard-hint"><kbd>Enter</kbd> para continuar</span><button class="btn ${a.feedback.correct?'correct':' '}" data-action="advance" id="primary-action">${a.i===a.ids.length-1&&a.mode!=='placement'?'Ver resultado':'Continuar'}${icon('arrow')}</button>`:`<button class="btn ghost" data-action="skip">Pular</button><span class="keyboard-hint"><kbd>Enter</kbd> para verificar</span><button class="btn" data-action="submit" id="primary-action" disabled>Verificar${icon('check')}</button>`}</div></section><p class="footer-note">${icon('shield')}Seu progresso é salvo a cada resposta.</p></div>`;
 if(q.type==='order')renderWords();updateSubmit();if(a.feedback)$('#primary-action').focus({preventScroll:true});else if($('#answer')&&window.innerWidth>680)$('#answer').focus({preventScroll:true});else $('#question-heading').focus({preventScroll:true});
}
function renderWords(){const a=state.active;if(!a)return;$('#word-zone').innerHTML=wordSelection.map((i,j)=>`<button class="word" data-remove="${j}" ${a.feedback?'disabled':''} aria-label="Remover ${esc(a.bank[i])}">${esc(a.bank[i])}</button>`).join('')||'<span class="muted tiny" style="padding:10px">Sua frase aparece aqui</span>';$('#word-bank').innerHTML=a.bank.map((w,i)=>`<button class="word ${wordSelection.includes(i)?'selected':''}" data-word="${i}" ${a.feedback||wordSelection.includes(i)?'disabled':''}>${esc(w)}</button>`).join('');a.selected=wordSelection.slice();}
function getAnswer(){const a=state.active,q=BY_ID[a.ids[a.i]];return q.type==='order'?wordSelection.map(i=>a.bank[i]).join(' '):q.type==='choice'?a.choice:$('#answer')?.value||a.draft;}
function updateSubmit(){const b=$('[data-action="submit"]');if(b)b.disabled=!getAnswer().trim();}
function expansions(s){s=String(s).toLowerCase().normalize('NFKC').replace(/[’‘`]/g,"'").replace(/[‐‑–—-]/g,' ');const fixed={"can't":'cannot',"won't":'will not',"shan't":'shall not',"ain't":'am not',"let's":'let us'};for(const [k,v] of Object.entries(fixed))s=s.replaceAll(k,v);s=s.replace(/\bcannot\b/g,'can not').replace(/n't\b/g,' not').replace(/'re\b/g,' are').replace(/'ve\b/g,' have').replace(/'ll\b/g,' will').replace(/'m\b/g,' am');let out=[s];const pat=/\b(i|you|he|she|it|we|they|there|that|what|who|where|how|when)('s|'d)\b/;for(let step=0;step<6&&out.some(v=>pat.test(v));step++){out=out.flatMap(v=>{const m=v.match(pat);if(!m)return[v];const options=m[2]==="'s"?[' is',' has']:[' would',' had'];return options.map(x=>v.replace(pat,m[1]+x));}).slice(0,64);}return out.map(normalize);}
function normalize(s){const equivalents={movie:'film',movies:'films',cancelled:'canceled',travelling:'traveling',travelled:'traveled',colour:'color',colours:'colors',organise:'organize',organised:'organized',centre:'center',centres:'centers',favour:'favor',neighbour:'neighbor',neighbours:'neighbors',twenty:'20',nine:'9',three:'3'};return s.replace(/[^\p{L}\p{N}\s]/gu,'').replace(/\s+/g,' ').trim().split(' ').map(w=>equivalents[w]||w).join(' ');}
function checkAnswer(q,answer){const attempts=expansions(answer),accepted=q.answers.flatMap(expansions);return attempts.some(a=>accepted.includes(a));}
function feedbackHTML(q,f){return `<div class="feedback ${f.correct?'':'wrong'}" role="status"><div class="feedback-title">${icon(f.correct?'check':'refresh',f.correct?'check-draw':'')}${f.correct?'Resposta correta':'Vamos ajustar'}${f.correct?`<span style="margin-left:auto;font-size:12px">+${f.xp} XP</span>`:''}</div><p class="answer" lang="en">${esc(q.answers[0])}</p><p>${esc(q.why)}</p><p class="rule"><strong>${LEVELS.indexOf(q.level)<3?'Regra':'Rule'}:</strong> ${esc(q.rule)}</p>${f.skip?'<p class="rule">Questão pulada · sem XP.</p>':''}</div>`;}
function grantXP(n){if(!n)return;const key=dayKey(),before=state.daily[key]||0;state.xp+=n;state.daily[key]=before+n;if(before<state.goal&&state.daily[key]>=state.goal){toast('Meta diária concluída. Seu próximo passo está mais perto.');confetti(35);}}
function submit(skip=false){const a=state.active;if(!a||a.feedback)return;const q=BY_ID[a.ids[a.i]],answer=skip?'':getAnswer().trim();if(!skip&&!answer)return;const correct=!skip&&checkAnswer(q,answer);a.draft=answer;state.days[dayKey()]=true;state.seen[q.id]=(state.seen[q.id]||0)+1;a.combo=correct?a.combo+1:0;const xp=correct?10+(a.combo>=3?5:0):0;a.correct+=Number(correct);a.xp+=xp;grantXP(xp);
 if(!correct){const old=state.errors[q.id];state.errors[q.id]={count:(old?.count||0)+1,answer:skip?'Questão pulada':answer,date:dayKey()};}else if(a.mode==='review'&&state.errors[q.id]){state.errors[q.id].count--;if(state.errors[q.id].count<=0)delete state.errors[q.id];}
 a.feedback={id:q.id,answer,correct,xp,skip};a.answers.push({...a.feedback});save();renderExercise();header();const card=$('#question-card');card.classList.add(correct?'success-pulse':'shake');if(correct){const float=document.createElement('span');float.className='float-xp';float.textContent=`+${xp} XP`;card.append(float);setTimeout(()=>float.remove(),1100);if(a.combo>=5)confetti(18);}sound(correct?'correct':'wrong');
}
function advance(){const a=state.active;if(!a||!a.feedback)return;if(a.mode==='placement'&&(a.i+1)%3===0){const score=a.answers.slice(-3).filter(v=>v.correct).length;if(score<2||a.level===4){finish(score>=2?a.level+1:a.level);return;}a.level++;a.unit=a.level*3;a.ids.push(...placementBlock(a.level));}if(a.i===a.ids.length-1){finish();return;}a.i++;a.feedback=null;prepareQuestion();save();renderExercise();}
function finish(placementLevel){const a=state.active;if(!a)return;let passed=false,first=false;if(a.mode==='placement'){state.placement=placementLevel;for(let i=0;i<placementLevel*3;i++)state.passes[i]=2;selectedLevel=placementLevel;passed=true;}else if(a.mode==='session'){passed=a.correct>=4;state.attempts[a.unit]++;if(passed)state.passes[a.unit]=Math.min(2,state.passes[a.unit]+1);}else if(a.mode==='boss'){passed=a.correct>=8;first=passed&&!state.bosses[a.level];if(first){state.bosses[a.level]=true;grantXP(50);a.xp+=50;selectedLevel=Math.min(5,a.level+1);}}else passed=a.correct/a.ids.length>=.8;
 state.lastResult={mode:a.mode,correct:a.correct,total:a.ids.length,xp:a.xp,unit:a.unit,level:placementLevel??a.level,passed,mastered:mastered(a.unit),first};state.active=null;save();navigate('summary');if(passed){confetti(first?110:65);sound('level');}
}

function fullSentence(q){return q.context.includes('___')?q.context.replace('___',q.answers[0]):q.answers[0];}
function redParts(text,why){const re=/\[\[([^|]+)\|([^\]]+)\]\]/g;let match,last=0,parts=[],errors=[];while((match=re.exec(text))){if(match.index>last)parts.push({text:text.slice(last,match.index)});const ix=errors.length;parts.push({text:match[1],error:ix});errors.push(item(`Corrija “${match[1]}”.`,match[2],why,match[1]));last=re.lastIndex;}if(last<text.length)parts.push({text:text.slice(last)});return {parts,items:errors};}

function reviewIds(){let previous='';return Object.entries(state.errors).sort((a,b)=>b[1].count-a[1].count).slice(0,8).map(([key,e],i)=>{const q=SUBITEMS[key],candidates=q.originalType==='swipe'?['trap','dictation','chat']:['chat','tone','surgery','dictation'];const original=e.type||q.originalType;const type=candidates.find(t=>t!==original&&t!==q.originalType&&t!==previous&&(t!=='surgery'||q.answers[0].split(' ').length>1)&&(!['dictation','surgery'].includes(t)||!['reading','detective','memory','gap'].includes(q.originalType)))||'chat';previous=type;return `review~${type}~${key}`;});}
function stopMedia(){const rec=recognizer;recognizer=null;utteranceRef=null;clearTimeout(speechTimeout);if(rec){try{rec.abort();}catch{}}if('speechSynthesis'in window)window.speechSynthesis.cancel();speechStatus='';}
function pauseClock(){if(clockInterval){clearInterval(clockInterval);clockInterval=null;}if(state.active?.mini){state.active.mini.running=false;save();}}
function cleanupGame(){pauseClock();stopMedia();gestureStart=null;}
start=function(mode,ui=0,li=Math.floor(ui/3),specific=null){
 if(state.active){toast('Retome a atividade salva antes de começar outra.');navigate('exercise');return;}
 let ids=[];if(mode==='placement'){li=0;ui=0;ids=placementBlock(0);}else if(mode==='session'){if(!unitUnlocked(ui)){toast('Conclua a etapa anterior primeiro.');return;}ids=selectGames(ui);}else if(mode==='boss'){if(!unlocked(li)||![0,1,2].every(j=>mastered(li*3+j))){toast('Conclua as três unidades do nível primeiro.');return;}ids=GAMES.filter(g=>g.scope===`boss${li}`).map(g=>g.id);ui=li*3+2;}else if(mode==='review'){ids=reviewIds();if(!ids.length){navigate('review');return;}ui=resolveGame(ids[0]).unit;li=Math.floor(ui/3);}else if(mode==='daily'){if(state.placement===null){toast('Faça o nivelamento antes do desafio diário.');start('placement');return;}if(state.challenges[dayKey()]?.done){toast('Desafio de hoje concluído. Amanhã tem outro.');navigate('daily');return;}const g=dailyGame();ui=g.unit;li=Math.floor(ui/3);ids=[g.id];state.challenges[dayKey()]={id:g.id,done:false};}else{mode='practice';if(specific){const g=GAME_BY_ID[specific];if(!g||g.scope!=='unit'||!unlocked(Math.floor(g.unit/3))){toast('Este minijogo será liberado com o nível.');return;}ids=[g.id];ui=g.unit;li=Math.floor(ui/3);}else{const pool=GAMES.filter(g=>g.scope==='unit'&&g.level===LEVELS[li]);ids=shuffle(pool).filter((g,i,a)=>a.findIndex(x=>x.type===g.type)===i).slice(0,6).map(g=>g.id);}}
 state.active={mode,unit:ui,level:li,ids,i:0,correct:0,score:0,xp:0,combo:0,answers:[],feedback:null,day:dayKey(),mini:null};state.lastResult=null;prepareQuestion();save();navigate('exercise');
};
prepareQuestion=function(){stopMedia();const g=currentGame();state.active.mini={step:0,draft:'',results:[],feedback:null,target:null,slot:null,flipped:[],matched:[],deck:g.type==='memory'?shuffle(Array.from({length:g.pairs.length*2},(_,i)=>i)):[],extraErrors:0,remaining:(g.seconds||0)*1000,running:false,started:false,streak:0,peak:0,revealed:false,fallback:false,activityXP:0};};
nextTask=function(){if(state.active)return {mode:'resume',unit:state.active.unit,level:state.active.level};if(state.placement===null)return {mode:'placement',unit:0,level:0};for(let li=0;li<6;li++){if(!unlocked(li))break;for(let j=0;j<3;j++)if(!mastered(li*3+j))return {mode:'session',unit:li*3+j,level:li};if(!levelComplete(li))return {mode:'boss',unit:li*3+2,level:li};}return {mode:'practice',unit:17,level:5};};
next=function(){const n=nextTask();if(n.mode==='resume')navigate('exercise');else start(n.mode,n.unit,n.level);};
function earn(base){const a=state.active,mult=a.mode==='daily'?2:1,xp=base*mult;a.xp+=xp;a.mini.activityXP+=xp;grantXP(xp);return xp;}
function record(q,correct,answer,{extra=false}={}){const a=state.active,g=currentGame(),m=a.mini;if(!extra&&m.results.some(x=>x.key===q.key))return null;if(['swipe','memory'].includes(g.type))pauseClock();state.days[dayKey()]=true;a.combo=correct?a.combo+1:0;const xp=correct?earn(10+(a.combo>=3?5:0)):0;if(!correct)errorEntry(q,answer,g);else if(state.errors[q.key]){state.errors[q.key].count--;if(state.errors[q.key].count<=0)delete state.errors[q.key];}if(extra)m.extraErrors++;else m.results.push({key:q.key,correct,answer:String(answer).slice(0,2000)});m.repair=null;m.feedback={correct,answer:correctAnswer(g,q),why:q.why||q.rule,xp,user:String(answer),extra,key:q.key};save();header();sound(correct?'correct':'wrong');if(correct&&a.combo>=5)confetti(18);return m.feedback;}
function correctAnswer(g,q){if(g.type==='swipe')return q.valid?`Correct: ${q.context}`:`Incorrect. ${q.why}`;if(g.type==='memory')return `${q.context} → ${q.answers[0]}`;return q.answers[0];}
function endActivity(force=false){const a=state.active,g=currentGame(),m=a.mini;if(a.feedback)return;if(force){for(const q of g.items)if(!m.results.some(x=>x.key===q.key))record(q,false,'Tempo encerrado / atividade pulada');}
 const correct=m.results.filter(x=>x.correct).length,ratio=correct/(g.items.length+m.extraErrors);let extra=0;if(g.type==='story'&&ratio===1)extra=20;if(g.type==='swipe')extra=Math.min(20,m.peak*2);if(g.type==='memory'&&ratio===1&&m.remaining>=30000)extra=10;if(extra)earn(extra);
 pauseClock();stopMedia();a.feedback={correct:ratio>=.7,ratio,extra:extra*(a.mode==='daily'?2:1),peak:m.peak,last:m.feedback};a.answers.push({id:g.id,ratio,xp:m.activityXP,missed:m.results.filter(result=>!result.correct).map(result=>result.key)});a.score+=ratio;a.correct+=Number(ratio>=.7);state.seen[g.id]=(state.seen[g.id]||0)+1;if(g.scope==='review')delete state.seen[g.id];state.completedGames++;save();renderExercise();header();
}
getAnswer=function(){return $('#answer')?.value||state.active?.mini.draft||'';};
updateSubmit=function(){const a=state.active;if(!a||a.feedback)return;const g=currentGame(),m=a.mini,b=$('[data-action="submit"]');if(b)b.disabled=m.feedback?false:g.type==='surgery'?m.slot===null:!getAnswer().trim();};
submit=function(skip=false){const a=state.active;if(!a||a.feedback)return;const g=currentGame(),m=a.mini;if(m.feedback){advance();return;}if(skip){endActivity(true);return;}if(['memory','swipe','story'].includes(g.type))return;if(g.type==='redpen'&&m.target===null){toast('Toque em um trecho que precisa de correção.');return;}const q=currentItem();let answer=getAnswer().trim();if(g.type==='surgery'){if(m.slot===null)return;const words=g.tokens.slice();words.splice(m.slot,0,g.word);answer=words.join(' ');}if(!answer)return;m.draft=answer;const correct=checkAnswer(q,answer);record(q,correct,answer);if(g.type==='redpen'){if(m.results.length===g.items.length)endActivity();else renderExercise();}else if(g.items.length===1)endActivity();else renderExercise();};
advance=function(){const a=state.active;if(!a)return;const g=currentGame(),m=a.mini;if(!a.feedback){if(!m.feedback)return;const extra=m.feedback.extra;m.feedback=null;m.draft='';if(g.type==='redpen')m.target=null;else if(g.type==='memory')m.flipped=[];else if(!extra)m.step++;save();if(['swipe','memory'].includes(g.type))startClock();else renderExercise();return;}
 if(a.mode==='placement'&&(a.i+1)%3===0){const passed=a.answers.slice(-3).filter(x=>x.ratio>=.7).length;if(passed<2||a.level===4){finish(passed>=2?a.level+1:a.level);return;}a.level++;a.unit=a.level*3;a.ids.push(...placementBlock(a.level));}
 if(a.i===a.ids.length-1){finish();return;}cleanupGame();a.i++;a.feedback=null;prepareQuestion();save();renderExercise();};
finish=function(placementLevel){const a=state.active;if(!a)return;cleanupGame();const ratio=a.score/a.ids.length;let passed=ratio>=.7,first=false;if(a.mode==='placement'){state.placement=placementLevel;for(let i=0;i<placementLevel*3;i++)state.passes[i]=2;selectedLevel=placementLevel;passed=true;}else if(a.mode==='session'){state.attempts[a.unit]++;if(passed)state.passes[a.unit]=Math.min(2,state.passes[a.unit]+1);}else if(a.mode==='boss'){passed=ratio>=BOSS_PASS;first=passed&&!state.bosses[a.level];if(first){state.bosses[a.level]=true;grantXP(50);a.xp+=50;selectedLevel=Math.min(5,a.level+1);}}else if(a.mode==='daily')state.challenges[a.day]={id:a.ids[0],done:true};
 state.lastResult={mode:a.mode,ratio,correct:a.correct,total:a.ids.length,xp:a.xp,unit:a.unit,level:placementLevel??a.level,passed,mastered:mastered(a.unit),first,results:a.answers};state.active=null;save();navigate('summary');if(passed){confetti(first?100:55);sound('level');}
};
function startClock(){const a=state.active;if(!a||a.feedback||a.mini.feedback)return;const m=a.mini;if(m.running)return;m.started=true;m.running=true;clockLast=performance.now();clockInterval=setInterval(()=>{if(state.active!==a||a.mini!==m||!m.running)return;if(view!=='exercise'||document.hidden||a.feedback||m.feedback){pauseClock();return;}const now=performance.now();m.remaining=Math.max(0,m.remaining-(now-clockLast));clockLast=now;const el=$('.clock-left');if(el){el.textContent=Math.ceil(m.remaining/1000)+'s';el.classList.toggle('urgent',m.remaining<=10000);}if(m.remaining===0){endActivity(true);return;}save();},200);save();renderExercise();}
function judge(valid){const a=state.active,g=currentGame();if(!a||g.type!=='swipe'||a.feedback||a.mini.feedback||!a.mini.running)return;const m=a.mini,q=g.items[m.step],correct=valid===q.valid;const el=$('#swipe-card');if(el&&!reduceMotion()){const rect=el.getBoundingClientRect(),clone=el.cloneNode(true);clone.removeAttribute('id');clone.className='swipe-card flying-card';Object.assign(clone.style,{left:rect.left+'px',top:rect.top+'px',width:rect.width+'px',height:rect.height+'px',margin:'0'});clone.style.setProperty('--fly',valid?'350px':'-350px');clone.style.setProperty('--rotate',valid?'18deg':'-18deg');document.body.append(clone);setTimeout(()=>clone.remove(),350);}
 m.streak=correct?m.streak+1:0;m.peak=Math.max(m.peak,m.streak);record(q,correct,valid?'Julguei correta':'Julguei incorreta');if(m.results.length===g.items.length)endActivity();else renderExercise();}
function flipCard(id){const a=state.active,g=currentGame(),m=a?.mini;if(!a||g.type!=='memory'||a.feedback||m.feedback||!m.running||m.flipped.includes(id)||m.matched.includes(Math.floor(id/2)))return;m.flipped.push(id);if(m.flipped.length===2){const [one,two]=m.flipped,pair=Math.floor(one/2),correct=pair===Math.floor(two/2);if(correct){m.matched.push(pair);record(g.items[pair],true,g.pairs[pair][1]);if(m.matched.length===g.pairs.length){endActivity();return;}}else record(g.items[pair],false,`${cardText(g,one)} ↔ ${cardText(g,two)}`,{extra:true});}save();renderExercise();}
function cardText(g,id){return g.pairs[Math.floor(id/2)][id%2];}
function pickStory(index){const a=state.active,g=currentGame(),m=a.mini;if(a.feedback||m.feedback)return;const q=g.items[m.step];record(q,index===q.correct,q.options[index]);if(m.results.length===g.items.length)endActivity();else renderExercise();}
function chooseRed(partIndex){const a=state.active,g=currentGame(),m=a.mini;if(a.feedback||m.feedback)return;const part=redTokens(g)[partIndex];if(part.error===undefined){const q=g.items.find(q=>!m.results.some(r=>r.key===q.key))||g.items[0];record(q,false,`Trecho já correto marcado: ${part.text}`,{extra:true});m.feedback.answer=part.text;m.feedback.why=LEVELS.indexOf(g.level)<3?'Este trecho já estava correto. Procure os erros nas formas verbais ou nas expressões do texto.':'This span is already correct. Check the remaining verb forms and fixed expressions.';}else if(!m.results.some(x=>x.key===g.items[part.error].key)){m.target=part.error;m.draft='';}save();renderExercise();}
function redTokens(g){return g.parts.flatMap(p=>p.error!==undefined?[p]:p.text.split(/(\s+)/).filter(Boolean).map(text=>({text,space:/^\s+$/.test(text)})));}
function feedbackBlock(f){
 if(!f)return '';

renderExercise=function(){const a=state.active;if(!a){navigate('home');return;}const g=currentGame(),m=a.mini,type=GAME_TYPES[g.type],total=a.mode==='placement'?18:a.ids.length;const modeName={placement:'Descoberta do seu nível',session:`${g.level} · ${UNITS[a.unit].title}`,boss:`Boss · ${BOSS_NAMES[a.level]}`,review:'Caderno em outra perspectiva',daily:'Desafio do dia · XP em dobro',practice:'Prática livre'}[a.mode];let feedback=m.feedback?feedbackBlock(m.feedback):'';if(a.feedback)feedback+=`<div class="score-chips"><span class="score-chip">${Math.round(a.feedback.ratio*100)}% nesta atividade</span>${a.feedback.extra?`<span class="score-chip">Bônus: +${a.feedback.extra} XP</span>`:''}${g.type==='swipe'?`<span class="score-chip">Melhor sequência: ${m.peak}</span>`:''}</div>`;
 const canSubmit=['chat','tone','trap','reading','detective','dictation','speak','surgery'].includes(g.type)||(g.type==='redpen'&&m.target!==null);const activeClock=['swipe','memory'].includes(g.type)&&m.started;

led>Verificar</button>':activeClock?'<button class="btn ghost" data-game="pause-clock">Pausar rodada</button>':''}`}</div></section><p class="footer-note">${icon('shield')}Seu avanço e o tempo restante ficam salvos.</p></div>`;

function speakAudio(slow=false){
 const g=currentGame(),a=state.active;if(!g||g.type!=='dictation')return;
 if(!('speechSynthesis'in window)||!window.SpeechSynthesisUtterance){audioFallback('Voz indisponível. Use a alternativa de leitura.');return;}
 const mini=a.mini;utteranceRef=null;window.speechSynthesis.cancel();clearTimeout(speechTimeout);
 const u=new window.SpeechSynthesisUtterance(g.sentence);utteranceRef=u;
 const isCurrent=()=>state.active===a&&a.mini===mini&&utteranceRef===u&&view==='exercise';
 const voices=window.speechSynthesis.getVoices(),voice=voices.find(v=>/^en[-_]GB/i.test(v.lang))||voices.find(v=>/^en/i.test(v.lang));if(voice)u.voice=voice;u.lang=voice?.lang||'en-US';u.rate=slow?.65:.95;u.pitch=1;
 u.onstart=()=>{if(!isCurrent())return;clearTimeout(speechTimeout);speechStatus='Reproduzindo…';$('#voice-wave')?.classList.add('playing');const s=$('#speech-status');if(s)s.textContent=speechStatus;};
 u.onend=()=>{if(!isCurrent())return;clearTimeout(speechTimeout);speechStatus='Ouça novamente se precisar.';$('#voice-wave')?.classList.remove('playing');const s=$('#speech-status');if(s)s.textContent=speechStatus;};
 u.onerror=e=>{if(isCurrent()&&e.error!=='canceled'&&e.error!=='interrupted')audioFallback('A voz não pôde ser reproduzida. Use a alternativa de leitura.');};
 speechStatus='Preparando a voz…';if($('#speech-status'))$('#speech-status').textContent=speechStatus;
 speechTimeout=setTimeout(()=>{if(isCurrent())audioFallback('A voz não respondeu. A alternativa de leitura está disponível.');},5000);
 try{window.speechSynthesis.speak(u);}catch{if(isCurrent())audioFallback('A voz não está disponível neste navegador.');}
}
function audioFallback(message){if(!state.active)return;clearTimeout(speechTimeout);utteranceRef=null;if('speechSynthesis'in window)window.speechSynthesis.cancel();speechStatus=message;state.active.mini.fallback=true;state.active.mini.revealed=false;save();renderExercise();}
function startRecognition(){
 const active=state.active,mini=active?.mini;if(!active||active.feedback||mini.feedback)return;
 if(recognizer){recognizer.stop();return;}
 const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Recognition){speechStatus='Use a alternativa digitada: o navegador não oferece reconhecimento.';renderExercise();return;}
 const rec=new Recognition();recognizer=rec;rec.lang='en-US';rec.interimResults=false;rec.maxAlternatives=1;rec.continuous=false;
 const isCurrent=()=>recognizer===rec&&state.active===active&&active.mini===mini&&view==='exercise'&&!active.feedback&&!mini.feedback;
 rec.onresult=e=>{if(!isCurrent())return;const transcript=e.results[0][0].transcript;mini.draft=transcript;const input=$('#answer');if(input)input.value=transcript;speechStatus='Transcrição pronta. Confira antes de verificar.';if($('#speech-status'))$('#speech-status').textContent=speechStatus;save();updateSubmit();};
 rec.onerror=e=>{if(!isCurrent())return;speechStatus=e.error==='not-allowed'?'Microfone não autorizado. A alternativa digitada continua disponível.':'Não foi possível reconhecer o áudio. Tente de novo ou digite.';};
 rec.onend=()=>{if(!isCurrent())return;recognizer=null;const input=$('#answer');if(input)mini.draft=input.value;renderExercise();};
 speechStatus='Ouvindo…';try{rec.start();renderExercise();}catch{if(!isCurrent())return;recognizer=null;speechStatus='O microfone não pôde iniciar. Use a alternativa digitada.';renderExercise();}
}

// Keep the last valid save recoverable and prevent stale tabs from overwriting it.
const BACKUP_KEY=STORAGE_KEY+'.backup',DAMAGED_KEY=STORAGE_KEY+'.damaged';
let storedSnapshot=null,backupSnapshot=null,storageConflict=false,damagedSnapshot=null,recoveredSave=false;

function storageNotice(message,conflict=false){
 const warning=$('#storage-warning');
 if(!warning)return;
 warning.hidden=storageOK;
 warning.innerHTML=esc(message)+(conflict?' <button class="btn secondary" data-storage-reload>Carregar progresso atualizado</button>':'');
}

load=function(){
 storageConflict=false;damagedSnapshot=null;recoveredSave=false;loadFailed=false;
 try{
  storedSnapshot=localStorage.getItem(STORAGE_KEY);
  backupSnapshot=localStorage.getItem(BACKUP_KEY);
  if(storedSnapshot){
   try{const loaded=validateState(JSON.parse(storedSnapshot));storageOK=true;return loaded;}
   catch{damagedSnapshot=storedSnapshot;}
  }
  if(backupSnapshot){
   try{const restored=validateState(JSON.parse(backupSnapshot));recoveredSave=true;storageOK=true;return restored;}
   catch{backupSnapshot=null;}
  }
  storageOK=!damagedSnapshot;loadFailed=!!damagedSnapshot;
 }catch{storageOK=false;loadFailed=true;}
 return fresh();
};

function markStorageConflict(){
 storageConflict=true;storageOK=false;
 if(clockInterval){clearInterval(clockInterval);clockInterval=null;}
 if(state.active?.mini)state.active.mini.running=false;
 stopMedia();
 storageNotice('O progresso mudou em outra aba. O salvamento desta aba está pausado. Carregue a versão atual ou exporte seu código em Preferências.',true);
}

save=function(){
 try{
  if(storageConflict||localStorage.getItem(STORAGE_KEY)!==storedSnapshot){markStorageConflict();return false;}
  const serialized=JSON.stringify(state);
  if(damagedSnapshot){
   // Do not replace unreadable data unless its original bytes are preserved.
   localStorage.setItem(DAMAGED_KEY,damagedSnapshot);
   damagedSnapshot=null;
  }
  if(serialized!==storedSnapshot){
   // An unreadable primary save must never replace a valid recovery copy.
   if(storedSnapshot){
    try{validateState(JSON.parse(storedSnapshot));
     if(backupSnapshot!==storedSnapshot){localStorage.setItem(BACKUP_KEY,storedSnapshot);backupSnapshot=storedSnapshot;}
    }catch{/* A backup failure must not prevent the primary save. */}
   }
   localStorage.setItem(STORAGE_KEY,serialized);storedSnapshot=serialized;
   // Seed recovery on the first save, including after recovery from corruption.
   if(!backupSnapshot){try{localStorage.setItem(BACKUP_KEY,serialized);backupSnapshot=serialized;}catch{}}
  }
  storageOK=true;loadFailed=false;storageNotice('');return true;
 }catch{
  storageOK=false;
  storageNotice('Não foi possível salvar no navegador. Seu avanço continua nesta aba; exporte um código em Preferências antes de fechar.');
  return false;
 }
};

replaceProgress=function(replacement,reset=false){
 const previous=state;
 state=replacement;
 if(!save()){state=previous;return false;}
 if(reset){
  try{localStorage.setItem(BACKUP_KEY,storedSnapshot);backupSnapshot=storedSnapshot;localStorage.removeItem(DAMAGED_KEY);}catch{}
 }
 return true;
};

handleProgressChange=function(event){
 if(event.key!==STORAGE_KEY&&event.key!==null)return;
 try{if(localStorage.getItem(STORAGE_KEY)!==storedSnapshot)markStorageConflict();}catch{storageOK=false;}
};

 if(!event.target.closest('[data-storage-reload]'))return;
 state=load();selectedLevel=state.placement??0;
 navigate('home');
 if(loadFailed)storageNotice('Não foi possível ler o progresso. Importe uma cópia em Preferências.');
 else{if(recoveredSave)save();toast(recoveredSave?'Cópia de segurança recuperada.':'Progresso atualizado.');}
});

// Browse practice activities without changing the saved learning session.
const CATALOG_PAGE_SIZE=12;
const catalogFilters={level:null,type:'',query:'',limit:CATALOG_PAGE_SIZE};

function catalogNormalize(value){return String(value??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();}

function catalogSearchText(g){
 const u=UNITS[g.unit],type=GAME_TYPES[g.type];
 return catalogNormalize([g.title,g.level,type[0],type[2],`Unidade ${g.unit+1}`,u.title,u.canDo,u.lesson,g.scene,g.docTitle,g.artifactTitle,g.artifact,g.clues,...(g.messages||[]),...g.items.flatMap(q=>[q.prompt,q.context])].filter(Boolean).join(' '));
}
const catalogSearchIndex=new Map(GAMES.filter(g=>g.scope==='unit').map(g=>[g.id,catalogSearchText(g)]));

// Public helpers remain independent of DOM rendering for filtering checks.
function catalogGames(filters=catalogFilters){
 if(state.placement===null)return [];
 const words=catalogNormalize(String(filters.query||'').slice(0,100)).split(' ').filter(Boolean);
 return GAMES.filter(g=>g.scope==='unit'&&unlocked(Math.floor(g.unit/3))&&(!filters.level||g.level===filters.level)&&(!filters.type||g.type===filters.type)&&words.every(word=>catalogSearchIndex.get(g.id).includes(word))).sort((a,b)=>a.unit-b.unit||Object.keys(GAME_TYPES).indexOf(a.type)-Object.keys(GAME_TYPES).indexOf(b.type));
}

function catalogCard(g){
 const u=UNITS[g.unit],[name,ic]=GAME_TYPES[g.type],played=(state.seen[g.id]||0)>0;
 const label=`Jogar ${g.title}. ${name}. Nível ${g.level}. Unidade ${g.unit+1}: ${u.title}.`;
 return `<li><button type="button" class="catalog-game" data-catalog-play="${esc(g.id)}" aria-label="${esc(label)}"><span class="catalog-card-top"><span class="type-icon">${icon(ic)}</span><span class="catalog-level">${esc(g.level)}</span></span><span class="catalog-type">${esc(name)}</span><span class="catalog-title">${esc(g.title)}</span><span class="catalog-description">${esc(g.scene||u.canDo)}</span><span class="catalog-unit">Unidade ${g.unit+1} · ${esc(u.title)}</span><span class="catalog-card-bottom"><span class="catalog-played ${played?'is-played':''}">${played?icon('check')+'Praticado':'Novo para você'}</span><span class="catalog-play">Praticar ${icon('arrow')}</span></span></button></li>`;
}

function catalogResultsHTML(games,limit=catalogFilters.limit){
 if(!games.length)return `<div class="catalog-empty"><span class="type-icon">${icon('search')}</span><h2>Nenhuma atividade por aqui.</h2><p>Tente outra palavra ou limpe os filtros para explorar os níveis liberados.</p><button type="button" class="btn secondary" data-catalog-action="clear">Limpar filtros</button></div>`;
 const shown=games.slice(0,limit),remaining=games.length-shown.length;
 return `<ul class="catalog-grid" aria-label="Atividades para praticar">${shown.map(catalogCard).join('')}</ul>${remaining>0?`<div class="catalog-more"><button type="button" class="btn secondary" data-catalog-action="more" aria-controls="catalog-results">Mostrar mais ${Math.min(CATALOG_PAGE_SIZE,remaining)} atividades ${icon('arrow')}</button><span>${remaining} ${remaining===1?'atividade restante':'atividades restantes'}</span></div>`:''}`;
}

function renderCatalogResults(focusIndex=null){
 const results=$('#catalog-results');if(!results)return;
 const games=catalogGames(),shown=Math.min(games.length,catalogFilters.limit);
 results.innerHTML=catalogResultsHTML(games);
 $('#catalog-count').textContent=games.length?`${games.length} ${games.length===1?'atividade encontrada':'atividades encontradas'} · ${shown} ${shown===1?'exibida':'exibidas'}`:'Nenhuma atividade encontrada';
 if(focusIndex!==null)results.querySelectorAll('[data-catalog-play]')[focusIndex]?.focus({preventScroll:true});
}

 renderCatalogResults();

 const key=control.dataset.catalogFilter;
 if(!['query','level','type'].includes(key))return;
 catalogFilters[key]=key==='query'?control.value.slice(0,100):control.value;
 catalogFilters.limit=CATALOG_PAGE_SIZE;

document.addEventListener('input',e=>{if(view==='arcade'&&e.target.dataset.catalogFilter==='query')changeCatalogFilter(e.target);});
document.addEventListener('change',e=>{if(view==='arcade'&&['level','type'].includes(e.target.dataset.catalogFilter))changeCatalogFilter(e.target);});
document.addEventListener('click',e=>{

// One guided path: discover a level, then move through the CEFR units in order.
const LINEAR_TYPES=['chat','redpen','story','tone','reading','surgery','trap'];
const LINEAR_LEVEL_COPY=[
 'frases simples e informações do dia a dia',
 'situações comuns com mais autonomia',
 'conversas e opiniões com confiança',
 'ideias conectadas e argumentos claros',
 'precisão, registro e intenção',
 'nuance, síntese e domínio do idioma'
];

 $('#nav').innerHTML=nav.map(([viewId,iconId,label])=>`<button data-nav="${viewId}" class="${view===viewId?'active':''}" ${view===viewId?'aria-current="page"':''}>${icon(iconId)}<span>${label}</span></button>`).join('');
 $('#crumb').textContent='/ '+(nav.find(item=>item[0]===view)?.[2]||'Aprendizado');
};

const previousLinearNavigate=navigate;
navigate=function(destination){
 if(['arcade','daily','review'].includes(destination))destination='path';
 const result=previousLinearNavigate(destination);
 if(destination!=='exercise'){activityActionObserver?.disconnect();syncActivityKeyboard();}
 return result;
};

mastered=function(ui){return (state.passes[ui]||0)>=1;};
levelComplete=function(li){return state.placement!==null&&li>=0&&li<6&&UNITS.slice(li*3,li*3+3).every(unit=>mastered(unit.id));};
unlocked=function(li){return state.placement!==null&&Number.isInteger(li)&&li>=0&&li<6&&(li===0||UNITS.slice(0,li*3).every(unit=>mastered(unit.id)));};
unitUnlocked=function(ui){return state.placement!==null&&Number.isInteger(ui)&&ui>=0&&ui<18&&(ui===0||UNITS.slice(0,ui).every(unit=>mastered(unit.id)));};
nextTask=function(){
 if(state.active)return {mode:'resume',unit:state.active.unit,level:state.active.level};
 if(state.placement===null)return {mode:'placement',unit:0,level:0};
 for(let ui=0;ui<UNITS.length;ui++)if(!mastered(ui))return {mode:'session',unit:ui,level:Math.floor(ui/3)};
 return {mode:'complete',unit:17,level:5};
};

selectGames=function(ui,n=6){
 const pool=shuffle(GAMES.filter(game=>game.scope==='unit'&&game.unit===ui&&LINEAR_TYPES.includes(game.type)));
 pool.sort((a,b)=>{
  const errors=g=>g.items.reduce((sum,q)=>sum+(state.errors[q.key]?.count||0),0);
  return errors(b)-errors(a)||(state.seen[a.id]||0)-(state.seen[b.id]||0);
 });
 const selected=[];
 for(const game of pool){if(selected.some(item=>item.type===game.type))continue;selected.push(game);if(selected.length===n)break;}
 return selected.map(game=>game.id);
};

placementBlock=function(li){
 const pool=shuffle(GAMES.filter(game=>game.scope==='unit'&&game.level===LEVELS[li]&&LINEAR_TYPES.includes(game.type)));
 const selected=[];
 for(const game of pool){if(selected.some(item=>item.type===game.type))continue;selected.push(game);if(selected.length===3)break;}
 return selected.map(game=>game.id);
};

const previousLinearStart=start;
start=function(mode,ui=0,li=Math.floor(ui/3)){
 if(state.active){navigate('exercise');return;}
 const task=nextTask();
 if(task.mode==='complete'){navigate('home');return;}
 if(task.mode==='resume'){navigate('exercise');return;}
 if(task.mode==='placement')return previousLinearStart('placement');
 return previousLinearStart('session',task.unit,task.level);
};

next=function(){
 const task=nextTask();
 if(task.mode==='resume')navigate('exercise');
 else if(task.mode==='complete')navigate('home');
 else start(task.mode,task.unit,task.level);
};

const previousLinearAdvance=advance;
advance=function(){
 const active=state.active;
 if(active?.mode==='placement'&&active.mini?.checkpoint){
  const level=active.level,passed=active.answers.slice(-3).filter(answer=>answer.ratio>=.7).length>=2;
  active.mini.checkpoint=false;
  if(!passed||level===5){finish(passed?5:level);return;}
  active.feedback=null;active.level=level+1;active.unit=active.level*3;
  active.ids.push(...placementBlock(active.level));active.i++;
  prepareQuestion();save();renderExercise();return;
 }
 if(active?.mode==='placement'&&active.feedback&&(active.i+1)%3===0){
  const passed=active.answers.slice(-3).filter(answer=>answer.ratio>=.7).length>=2;
  if(passed&&active.level<5){active.mini.checkpoint=true;save();renderExercise();return;}
  finish(passed?5:active.level);return;
 }
 return previousLinearAdvance();
};

 if(active.feedback||mini.feedback)return '';
 const hint=active.mode==='session'&&(game.type!=='redpen'||mini.target!==null)?currentItem().rule:'';
 return `<div class="learning-help"><details><summary>${icon('book')}Como responder</summary><p>${esc(LEARNING_INSTRUCTIONS[game.type]||'Leia o pedido e responda em inglês.')}</p><p class="help-note">“Não sei” revela somente esta pergunta e a registra para praticar depois.</p></details>${hint?`<details class="question-hint"><summary>${icon('spark')}Preciso de uma dica</summary><p>${esc(hint)}</p></details>`:''}</div>`;
}
function repairAvailable(){
 const active=state.active,feedback=active?.mini.feedback;
 return Boolean(active?.mode==='session'&&feedback&&!feedback.correct&&!feedback.extra&&['chat','reading','tone','trap','redpen'].includes(currentGame().type));
}
function repairHTML(){
 if(!repairAvailable())return '';
 const repair=state.active.mini.repair;
 if(!repair?.open)return '<button class="text-btn repair-open" data-learning="repair-open">Quero corrigir minha resposta</button>';
 if(repair.correct)return '<div class="repair-success" role="status">Agora sim. Use essa estrutura na próxima pergunta.<small>A correção foi uma prática; a nota original foi mantida.</small></div>';
 return `<div class="repair-box"><label class="question-label" for="repair-answer">Reescreva sua resposta</label><p class="repair-note">Use a explicação acima. Esta prática não altera sua nota nem gera XP.</p><textarea id="repair-answer" class="question-input" rows="2" lang="en" spellcheck="false" autocomplete="off" autocapitalize="none" autocorrect="off" enterkeyhint="done" maxlength="2000" placeholder="Tente escrever novamente…">${esc(repair.draft)}</textarea>${repair.checked?'<p class="repair-status" role="status">Ainda há um ajuste. Confira a resposta aceita e tente novamente, ou continue quando quiser.</p>':''}<button class="btn secondary" data-learning="repair-check">Conferir correção</button></div>`;
}
function openRepair(){
 if(!repairAvailable())return;
 const mini=state.active.mini;
 mini.repair={open:true,draft:'',checked:false,correct:false,key:mini.feedback.key||currentItem().key};
 save();renderExercise();$('#repair-answer')?.focus();
}
function checkRepair(){
 if(!repairAvailable())return;
 const mini=state.active.mini,repair=mini.repair;
 if(!repair?.open||repair.correct)return;
 const question=currentGame().items.find(item=>item.key===repair.key);
 if(!question)return;
 repair.draft=String($('#repair-answer')?.value||repair.draft||'').slice(0,2000);
 if(!repair.draft.trim())return;
 repair.checked=true;repair.correct=checkAnswer(question,repair.draft);
 save();renderExercise();
 if(!repair.correct)$('#repair-answer')?.focus();
}
const submitBeforeLearningHelp=submit;
submit=function(skip=false){
 if(!skip&&document.activeElement?.id==='repair-answer'){checkRepair();return;}
 if(!skip||!state.active||!LINEAR_TYPES.includes(currentGame().type))return submitBeforeLearningHelp(skip);
 const active=state.active,mini=active.mini,game=currentGame();
 if(active.feedback||mini.feedback)return;
 if(game.type==='redpen'&&mini.target===null)mini.target=game.items.findIndex(item=>!mini.results.some(result=>result.key===item.key));
 const question=currentItem();
 const feedback=record(question,false,'Não sei ainda');
 if(!feedback)return;
 feedback.skipped=true;
 if(mini.results.length===game.items.length)endActivity();
 else{save();renderExercise();}
};
document.addEventListener('click',event=>{
 const action=event.target.closest('[data-learning]')?.dataset.learning;
 if(action==='repair-open')openRepair();else if(action==='repair-check')checkRepair();
});
document.addEventListener('input',event=>{
 if(event.target.id!=='repair-answer'||!repairAvailable()||!state.active.mini.repair)return;
 const repair=state.active.mini.repair;repair.draft=event.target.value.slice(0,2000);repair.checked=false;repair.correct=false;save();
});
// A correction can be open after the activity has already been graded.
// Handle its Enter before the shared shortcut can advance to the next activity.
document.addEventListener('keydown',event=>{
 if(event.target.id!=='repair-answer'||event.key!=='Enter'||event.shiftKey||event.isComposing||view!=='exercise'||$('#modal').open)return;
 event.preventDefault();event.stopImmediatePropagation();checkRepair();
},true);
function learningRecapHTML(result){
 if(result.mode!=='session')return '';
 const rules=[...new Set((result.results||[]).flatMap(answer=>(answer.missed||[]).map(key=>SUBITEMS[key]?.rule)).filter(Boolean))].slice(0,2);
 return `<section class="learning-recap"><h2>O que você praticou</h2><p>${esc(UNITS[result.unit].canDo)}</p>${rules.length?`<h3>Para reforçar</h3><ul>${rules.map(rule=>`<li>${esc(rule)}</li>`).join('')}</ul>`:''}</section>`;
}

function focusHeaderHTML(active){
 const placement=active.mode==='placement',completed=active.i+(active.feedback?1:0),total=placement?18:active.ids.length;
 const label=placement?'Descobrindo seu nível':UNITS[active.unit].title;
 return `<header class="focus-header"><button class="focus-exit icon-btn" data-action="pause" aria-label="Salvar e sair da atividade" title="Salvar e sair">${icon('close')}</button><div class="focus-progress"><div class="focus-progress-label"><span>${esc(label)}</span><span>${placement?`${LEVELS[active.level]} · ${active.i%3+1} de 3`:`${active.i+1} de ${total}`}</span></div><div class="focus-meter" role="progressbar" aria-label="${placement?'Progresso da descoberta, até 18 atividades':'Progresso da unidade'}" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${completed}"><span style="width:${completed/total*100}%"></span></div></div></header>`;
}
function assessmentCheckpoint(){
 const active=state.active,level=active.level,results=active.answers.slice(-3),correct=results.filter(answer=>answer.ratio>=.7).length;
 return `<section class="level-reveal" aria-live="polite"><div class="level-reveal-art"><span class="reveal-ring"></span><img src="assets/papagaio-azul.png" alt="Papagaio Azul comemorando seu progresso"></div><div class="eyebrow">SINAL DE PROGRESSO · ${LEVELS[level]}</div><h1>${correct===3?'Que salto!':correct===2?'Temos uma pista.':'Cada resposta ajudou a ajustar o próximo passo.'}</h1><p>Você concluiu esta etapa de leitura e escrita. Vamos conferir como se sente no próximo nível.</p><div class="reveal-evidence" aria-label="Resultado das três atividades">${results.map((answer,index)=>`<span class="evidence-dot ${answer.ratio>=.7?'is-correct':'needs-practice'}" title="Atividade ${index+1}: ${Math.round(answer.ratio*100)}%"></span>`).join('')}<strong>${correct}/3</strong></div><div class="assessment-levels">${LEVELS.map((name,index)=>`<span class="assessment-level ${index<level?'passed':index===level?'current':''}">${name}</span>`).join('')}</div><button class="btn" id="assessment-continue" data-action="advance">Continuar descoberta ${icon('arrow')}</button><p class="tiny muted">Sem cronômetro. Você pode parar e retomar quando quiser.</p></section>`;
}
renderExercise=function(){
 const active=state.active;if(!active){navigate('home');return;}
 header();
 if(active.mode==='placement'&&active.mini.checkpoint){
  $('#app').innerHTML=`<div class="exercise-wrap focus-checkpoint">${focusHeaderHTML(active)}${assessmentCheckpoint()}</div>`;
  $('#assessment-continue')?.focus({preventScroll:true});observeActivityActions();return;
 }
 const game=currentGame(),mini=active.mini,type=GAME_TYPES[game.type],feedback=mini.feedback;
 const answered=Boolean(active.feedback||feedback),canSubmit=['chat','tone','trap','reading','surgery'].includes(game.type)||(game.type==='redpen'&&mini.target!==null);
 const focused=document.activeElement,slotFocus=focused?.dataset?.slot;
 const helper=game.type==='story'?'Escolha uma resposta para continuar.':game.type==='redpen'?'Toque no trecho que precisa de correção.':'Escolha onde a palavra se encaixa.';
 const questionNumber=Math.min(game.items.length,Math.max(1,mini.results.length+(feedback&&!feedback.extra?0:1)));
 const action=answered?`<button class="btn ${(active.feedback?.correct??feedback?.correct)?'correct':''}" data-action="advance" id="primary-action">${active.feedback&&active.i===active.ids.length-1&&active.mode!=='placement'?'Ver resultado':'Continuar'}${icon('arrow')}</button>`:canSubmit?'<button class="btn" data-action="submit" id="primary-action" disabled>Verificar resposta</button>':`<span class="focus-action-hint">${helper}</span>`;
 $('#app').innerHTML=`<div class="exercise-wrap">${focusHeaderHTML(active)}<section class="question-card game-stage" id="question-card"><div class="focus-activity-label"><span>${icon(type[1])}${type[0]}</span><span aria-label="Nível ${game.level}, pergunta ${questionNumber} de ${game.items.length}">${game.level} · ${questionNumber}/${game.items.length}</span></div><h1 id="activity-title" tabindex="-1">${esc(game.title)}</h1><div class="focus-stage">${stageHTML(game)}</div>${feedback?`<div class="focus-feedback" tabindex="-1">${feedbackBlock(feedback)}${repairHTML()}</div>`:learningHelpHTML(game)}</section><footer class="focus-actions ${answered?'has-feedback':''}"><div class="focus-actions-inner">${answered?'':`<button class="btn ghost" data-action="skip">Não sei</button>`}${action}</div></footer></div>`;
 updateSubmit();observeActivityActions();
 if(answered){$('#primary-action')?.focus({preventScroll:true});requestAnimationFrame(()=>{if(view==='exercise'&&state.active===active&&state.active.mini===mini)$('.focus-feedback')?.scrollIntoView({block:'nearest',behavior:'instant'});});}
 else if(slotFocus!==undefined&&/^\d+$/.test(slotFocus))$(`[data-slot="${slotFocus}"]`)?.focus({preventScroll:true});
 else if(game.type==='redpen'&&mini.target!==null&&focused?.dataset?.red!==undefined)$('#answer')?.focus();
 else $('#activity-title')?.focus({preventScroll:true});
};

// Reserve the actual action-bar height so large text never covers an answer.
let activityActionObserver;
function observeActivityActions(){
 activityActionObserver?.disconnect();
 const actions=$('.focus-actions');
 const measure=()=>document.documentElement.style.setProperty('--activity-actions-height',`${actions?.getBoundingClientRect().height||0}px`);
 measure();
 if(actions&&typeof ResizeObserver!=='undefined'){activityActionObserver=new ResizeObserver(measure);activityActionObserver.observe(actions);}
}
function syncActivityKeyboard(){
 const viewport=window.visualViewport,typing=view==='exercise'&&document.activeElement?.matches?.('input,textarea');
 const offset=viewport&&typing?Math.max(0,window.innerHeight-viewport.height-viewport.offsetTop):0;
 document.documentElement.style.setProperty('--keyboard-offset',`${Math.round(offset)}px`);
 document.body.classList.toggle('keyboard-open',Boolean(typing&&offset>80));
}
window.visualViewport?.addEventListener('resize',syncActivityKeyboard);
window.visualViewport?.addEventListener('scroll',syncActivityKeyboard);
document.addEventListener('focusin',syncActivityKeyboard);
document.addEventListener('focusout',()=>requestAnimationFrame(syncActivityKeyboard));

function learningMapHTML(compact=false){
 const task=nextTask(),startUnit=state.placement===null?0:state.placement*3;
 return `<section class="learning-map" aria-label="Percurso linear do A1 ao C2">${LEVELS.map((level,li)=>{
  if(compact&&li!==task.level)return '';
  const units=UNITS.slice(li*3,li*3+3),available=state.placement!==null&&units.some(unit=>unitUnlocked(unit.id)),levelDone=units.every(unit=>mastered(unit.id));
  return `<details class="map-level ${available?'is-open':''} ${levelDone?'is-done':''}" ${compact||li===task.level?'open':''}><summary class="map-level-head"><span class="map-level-mark">${levelDone?icon('check'):level}</span><span class="map-level-heading"><span class="eyebrow">NÍVEL ${level}</span><strong>${LEVEL_NAMES[li]}</strong></span><span class="map-level-status">${state.placement===null?'a descobrir':levelDone?'concluído':li===task.level?'atual':'a seguir'}</span><span class="map-chevron">${icon('arrow')}</span></summary><p class="map-level-focus">${LINEAR_LEVEL_COPY[li]}</p><div class="map-units">${units.map((unit,index)=>{
   const below=state.placement!==null&&unit.id<startUnit,done=mastered(unit.id)&&!below,current=state.placement!==null&&task.unit===unit.id&&!done,locked=state.placement===null||(!below&&!done&&!current&&unit.id>task.unit);
   const status=below?'avaliada':done?'concluída':current?(state.active?'em andamento':'próxima etapa'):'a seguir';
   return `<div class="map-unit ${done?'is-done':''} ${current?'is-current':''} ${locked?'is-locked':''} ${below?'is-assessed':''}"><span class="map-unit-node">${done?icon('check'):below?'↗':String(index+1).padStart(2,'0')}</span><div class="map-unit-copy"><strong>${esc(unit.title)}</strong><span>${esc(unit.canDo)}</span></div><span class="map-unit-status">${status}</span></div>`;
  }).join('')}</div></details>`;
 }).join('')}</section>`;
}

function progressHeadline(task){
 if(task.mode==='placement')return {tag:'SEU PRIMEIRO PASSO',title:'Seu inglês tem um ponto de partida.',description:'Descubra o seu com situações de leitura e escrita que se adaptam às suas respostas.'};
 if(task.mode==='resume')return state.active.mode==='placement'?{tag:'DESCOBERTA EM ANDAMENTO',title:'Vamos de onde você parou.',description:'Suas respostas estão salvas. Continue descobrindo seu ponto de partida.'}:{tag:'SUA PRÓXIMA ETAPA',title:UNITS[task.unit].title,description:UNITS[task.unit].canDo};
 if(task.mode==='complete')return {tag:'PERCURSO CONCLUÍDO',title:'Um caminho inteiro de conquistas.',description:'Você concluiu a trilha de leitura e escrita até o C2. Veja as etapas do seu percurso.'};
 return {tag:`${LEVELS[task.level]} · UNIDADE ${(task.unit%3)+1}`,title:UNITS[task.unit].title,description:UNITS[task.unit].canDo};
}
function learningHero(){
 const task=nextTask(),copy=progressHeadline(task),button=task.mode==='placement'?'Descobrir meu nível':task.mode==='resume'?'Retomar percurso':task.mode==='complete'?'Ver percurso completo':'Continuar aprendendo';
 const progress=state.placement===null?0:Math.round((UNITS.filter(unit=>mastered(unit.id)).length/18)*100);
 return `<section class="linear-hero ${task.mode==='placement'?'discovery-hero':''}"><div class="linear-hero-copy"><span class="eyebrow">${copy.tag}</span><h1>${copy.title}</h1><p>${copy.description}</p>${task.mode==='placement'?'<div class="discovery-promise"><span>LEITURA</span><i></i><span>ESCRITA</span><i></i><span>A1 → C2</span></div>':`<div class="journey-progress"><div class="journey-progress-copy"><span>SEU PERCURSO</span><strong>${progress}%</strong></div><div class="journey-meter" role="progressbar" aria-label="Progresso do percurso" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${progress}"><span style="--journey-progress:${progress}%"></span></div></div>`}<button class="btn linear-cta" ${task.mode==='complete'?'data-nav="path"':'data-action="next"'}>${button} ${icon('arrow')}</button><p class="linear-reassurance">${task.mode==='placement'?'No seu ritmo. Só leitura e escrita.':'Seu progresso é salvo automaticamente.'}</p></div><div class="linear-hero-art" aria-hidden="true"><span class="parrot-sun"></span><img src="assets/papagaio-azul.png" alt=""><span class="parrot-star">✦</span></div></section>`;
}

renderHome=function(){
 const discovering=state.placement===null;
 $('#app').innerHTML=`<div class="home-intro"><div><span class="eyebrow">SEU ESPAÇO DE APRENDIZADO</span><h2>Um passo de cada vez.</h2></div><span class="home-level-pill">${discovering?'A1 → C2':LEVELS[nextTask().level]}</span></div>${learningHero()}<div class="learning-home-heading"><h2>${discovering?'Uma trilha feita para você':'Seu capítulo atual'}</h2><button class="text-btn" data-nav="path">Ver trilha ${icon('arrow')}</button></div>${discovering?`<ol class="journey-onboarding"><li><span>01</span><div><strong>Encontre seu ponto de partida</strong><p>As perguntas se ajustam ao seu inglês.</p></div></li><li><span>02</span><div><strong>Aprenda em situações reais</strong><p>Leia, traduza, escreva e faça escolhas.</p></div></li><li><span>03</span><div><strong>Avance uma etapa por vez</strong><p>Cada unidade prepara a próxima.</p></div></li></ol>`:learningMapHTML(true)}<div class="learning-footnote">${icon('shield')}${discovering?'A avaliação estima seu ponto de entrada em leitura e escrita.':'Seu percurso fica salvo neste navegador.'}</div>`;
};
renderPath=function(){
 const task=nextTask();
 $('#app').innerHTML=`<div class="path-page-heading"><span class="eyebrow">6 NÍVEIS · 18 UNIDADES</span><h1>Seu inglês, etapa por etapa.</h1><p>Um percurso de leitura e escrita, do seu ponto de partida até o C2.</p></div><div class="path-continue"><span>${task.mode==='placement'?'Comece descobrindo seu nível.':task.mode==='complete'?'Todas as etapas concluídas.':'Sua próxima etapa está pronta.'}</span>${task.mode==='complete'?'':`<button class="btn" data-action="next">${task.mode==='placement'?'Descobrir nível':'Continuar'}${icon('arrow')}</button>`}</div>${learningMapHTML()}`;
};
renderArcade=function(){renderPath();};
renderDaily=function(){renderPath();};
renderNotebook=function(){renderPath();};

renderSummary=function(){
 const result=state.lastResult;if(!result){navigate('home');return;}
 const task=nextTask(),placement=result.mode==='placement',complete=task.mode==='complete';
 const title=placement?`Seu ponto de partida é ${LEVELS[result.level]}.`:result.passed?complete?'Percurso completo.':'Unidade concluída.':`Seu próximo passo continua em ${LEVELS[Math.floor(result.unit/3)]}.`;
 const description=placement?`Nas atividades de leitura e escrita, seu desempenho indica ${LEVELS[result.level]} como ponto de partida. Os níveis anteriores foram considerados na avaliação.`:result.passed?complete?'Você concluiu todas as 18 unidades do A1 ao C2.':'O próximo trecho da trilha já está liberado. Vamos avançar.':'Você já identificou o que precisa de mais prática. A trilha continua nesta unidade, com outros formatos e questões.';
 const mascotLine=placement?result.level>=4?'Você já navega por estruturas avançadas. Agora vamos lapidar precisão e nuance.':result.level>=2?'Você já consegue lidar com várias situações reais. Vamos consolidar sua próxima etapa.':'Todo começo conta. Agora você tem um ponto de partida feito para você.':result.passed?'Mais uma etapa virou conhecimento seu.': 'Errar apontou o próximo ajuste. Vamos usá-lo no caminho.';
 $('#app').innerHTML=`<section class="learning-result ${placement?'placement-result':''} ${result.passed?'result-success':'result-practice'}"><div class="result-mascot"><img src="assets/papagaio-azul.png" alt="Papagaio Azul acompanhando seu percurso"></div><span class="eyebrow">${placement?'DESCOBERTA CONCLUÍDA':result.passed?'ETAPA CONCLUÍDA':'UM PASSO DE APRENDIZADO'}</span><h1>${title}</h1><p class="result-description">${description}</p>${placement?`<div class="level-result-orbit"><span class="orbit-glow"></span><strong>${LEVELS[result.level]}</strong><span>PONTO DE PARTIDA</span></div><div class="result-level-row">${LEVELS.map((level,index)=>`<span class="assessment-level ${index<result.level?'passed':index===result.level?'current':''}">${level}</span>`).join('')}</div>`:`<div class="unit-result"><span class="unit-result-number">${String(result.unit+1).padStart(2,'0')}</span><div><strong>${esc(UNITS[result.unit].title)}</strong><span>${Math.round(result.ratio*100)}% de precisão · ${result.correct} de ${result.total} atividades</span></div><span class="unit-result-xp">+${result.xp} XP</span></div>`}<div class="mascot-message"><span class="mascot-message-mark">✦</span><p>${mascotLine}</p></div><button class="btn linear-cta" data-action="next">${placement?`Começar por ${LEVELS[result.level]}`:complete?'Ver percurso completo':result.passed?'Seguir para a próxima unidade':'Continuar nesta unidade'} ${icon('arrow')}</button><p class="result-note">${placement?'Estimativa de entrada baseada somente em leitura e escrita.':`Seu próximo passo: ${task.mode==='complete'?'fim do percurso':task.mode==='session'?`unidade ${task.unit+1} · ${LEVELS[task.level]}`:'retomar sua sessão'}.`}</p></section>`;
 if(!placement){const xp=$('.unit-result-xp');if(xp)xp.setAttribute('aria-label',`${result.xp} XP conquistados`);}
 $('.learning-result .mascot-message')?.insertAdjacentHTML('beforebegin',learningRecapHTML(result));
 $('#app').insertAdjacentHTML('afterbegin',`<div class="result-top"><button class="text-btn" data-nav="home">${icon('close')}Voltar ao início</button></div>`);
};

renderSettings=function(){
 $('#app').innerHTML=`<div class="path-page-heading"><span class="eyebrow">PREFERÊNCIAS</span><h1>Seu progresso, no seu dispositivo.</h1><p>Salve uma cópia ou leve a trilha para outro navegador.</p></div><section class="settings linear-settings"><section class="card"><h2>Progresso de aprendizado</h2><p>Gere um código para guardar uma cópia. Importar um código substitui o progresso atual após confirmação.</p><div class="button-row"><button class="btn secondary" data-action="export">${icon('download')}Gerar código</button><button class="btn secondary" data-action="copy">Copiar código</button></div><label for="save-code" class="question-label">Código de progresso</label><textarea id="save-code" class="code" placeholder="Gere seu código ou cole um código FLUENT2…" spellcheck="false"></textarea><button class="btn" data-action="import">Importar progresso ${icon('arrow')}</button><p id="import-status" role="status" style="margin:12px 0 0"></p></section><section class="card"><h2>Como funciona sua trilha</h2><p>O nivelamento e as unidades medem leitura e escrita. O percurso segue do seu ponto de entrada até o C2, uma unidade por vez. Não há tarefas de fala ou escuta.</p><div class="source-links"><a href="https://www.coe.int/en/web/common-european-framework-reference-languages/cefr-descriptors" target="_blank" rel="noopener noreferrer">Descritores CEFR do Conselho da Europa ↗</a></div></section></section>`;
};

function clearOutOfPathSession(){
 const active=state.active;if(!active)return;
 const usesVoice=active.ids.some(id=>['dictation','speak'].includes(resolveGame(id)?.type));
 if(!usesVoice&&!['daily','review','boss','practice'].includes(active.mode))return;
 cleanupGame();state.active=null;save();
 toast(usesVoice?'A atividade salva foi retomada pela trilha de leitura e escrita.':'A trilha agora segue em sequência. Seu progresso concluído foi mantido.');
}

clearOutOfPathSession();
header();renderHome();

</script>
</body>
</html>
