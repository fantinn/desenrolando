/* Papagaio Azul companion */
.brand-mark{overflow:hidden;background:#1557cc;transform:none;border-radius:11px}
.brand-mark img{display:block;width:100%;height:100%;object-fit:cover}
.hero-art{width:190px;height:220px;right:8px;top:21px;transform:none}
.mascot-halo{position:absolute;inset:7px 0 0;border-radius:50%;background:#ffffff84;box-shadow:0 0 0 1px #ffffff80}
.hero-parrot{position:absolute;width:190px;height:220px;object-fit:contain;right:0;bottom:-2px;filter:drop-shadow(0 12px 13px #17285b20);animation:mascot-float 4s ease-in-out infinite}
.mascot-wave{position:absolute;right:1px;top:4px;background:#fff;color:#5140bd;padding:8px 12px;border-radius:15px 15px 3px 15px;box-shadow:0 5px 18px #29335a14;font-size:12px;font-weight:750;transform:rotate(4deg)}
.mascot-wave span{color:#ffb333;font-size:15px;margin-left:3px}
.chat-companion{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--muted);font-size:10px;white-space:nowrap}
.chat-companion img{width:32px;height:32px;object-fit:contain}
.audio-companion{display:flex;align-items:center;gap:10px;padding:10px 13px;margin:0 0 14px;background:linear-gradient(105deg,#eef5ff,#fff8e9);border:1px solid #dbe8fb;border-radius:12px;color:#46536b;font-size:12px;font-weight:600}
.audio-companion img{width:48px;height:48px;object-fit:contain;flex:none}
@keyframes mascot-float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(1deg)}}
@media(max-width:1150px){.hero-art{right:-10px;opacity:.95}.hero-parrot{width:175px}}
@media(max-width:680px){.hero-art{right:-26px;top:36px;transform:scale(.84);transform-origin:right center;opacity:.88}.hero-parrot{width:175px}.hero-copy{width:77%}.chat-companion span{display:none}}
@media(prefers-reduced-motion:reduce){.hero-parrot{animation:none}}

.catalog-filters{padding:22px}
.catalog-fields{display:grid;grid-template-columns:minmax(190px,1.5fr) minmax(150px,.8fr) minmax(180px,1fr);gap:18px}
.catalog-field{min-width:0}
.catalog-field label{display:block;margin:0 0 8px;font-size:12px;font-weight:650}
.catalog-field input,.catalog-field select{width:100%;min-width:0;min-height:46px;margin:0;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:13px}
.catalog-field input::placeholder{color:var(--muted);opacity:1}
.catalog-search-box{position:relative}
.catalog-search-box>svg{position:absolute;left:13px;top:14px;width:18px;height:18px;color:var(--muted);pointer-events:none}
.catalog-search-box input{padding-left:40px}
.catalog-filter-note{margin:14px 0 0;font-size:12px;line-height:1.6;color:var(--muted)}
.catalog-results-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:16px 0 12px}
.catalog-results-bar p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}
.catalog-clear{background:transparent;border:0;padding:12px 0 12px 12px;min-height:44px;color:var(--accent);font-size:12px;font-weight:650;flex-shrink:0}
.catalog-clear:hover{text-decoration:underline}
.catalog-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;padding:0;margin:0;list-style:none}
.catalog-grid>li{min-width:0;display:flex}
.catalog-game{display:flex;flex-direction:column;align-items:stretch;text-align:left;width:100%;padding:22px;background:var(--paper);border:1px solid var(--line);border-radius:17px;transition:border-color .2s,box-shadow .2s;overflow-wrap:anywhere}
.catalog-game:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.catalog-card-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:19px}
.catalog-level{padding:5px 9px;background:var(--soft);color:var(--accent);border-radius:7px;font-size:11px;font-weight:750;letter-spacing:.4px}
.catalog-type{color:var(--accent);font-size:11px;font-weight:650;margin-bottom:7px}
.catalog-title{font-size:17px;font-weight:700;line-height:1.35;letter-spacing:-.3px}
.catalog-description{font-size:12px;line-height:1.65;color:var(--muted);margin:11px 0 17px}
.catalog-unit{font-size:11px;line-height:1.55;color:var(--muted);margin-top:auto;padding-top:2px}
.catalog-card-bottom{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:9px;margin-top:17px;padding-top:14px;border-top:1px solid var(--line);font-size:11px}
.catalog-play{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-weight:700}
.catalog-play svg{width:15px;height:15px}
.catalog-played{display:inline-flex;align-items:center;gap:4px;color:var(--muted)}
.catalog-played.is-played{color:var(--green)}
.catalog-played svg{width:14px;height:14px}
.catalog-more{display:flex;flex-direction:column;align-items:center;gap:11px;margin:27px 0 8px}
.catalog-more>span{color:var(--muted);font-size:12px}
.catalog-empty{padding:45px 22px;text-align:center;background:var(--paper);border:1px dashed var(--line);border-radius:16px}
.catalog-empty h2{font-size:21px;margin:18px 0 10px}
.catalog-empty p{font-size:13px;line-height:1.6;color:var(--muted);max-width:380px;margin:0 auto 22px}
.catalog-welcome{max-width:700px;padding:34px}
.catalog-welcome h2{max-width:510px;font-size:25px;line-height:1.35;letter-spacing:-.6px;margin:20px 0 12px}
.catalog-welcome p{max-width:500px;font-size:14px;line-height:1.75;color:var(--muted);margin:0 0 22px}
.catalog-welcome p:last-child{margin:13px 0 0;font-size:12px}
.catalog-resume{display:flex;align-items:center;justify-content:space-between;gap:20px;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:18px 22px;margin-bottom:20px}
.catalog-resume strong{font-size:13px}
.catalog-resume p{margin:5px 0 0;font-size:12px;line-height:1.6;color:var(--muted)}
.catalog-resume .btn{flex-shrink:0}

.top-stats .stat-inline:first-child,#sound{display:none!important}
.topbar{height:76px}
.linear-hero{position:relative;isolation:isolate;min-height:340px;display:grid;grid-template-columns:minmax(0,1fr) 300px;align-items:center;overflow:hidden;padding:38px 46px;border:1px solid #dce7f9;border-radius:28px;background:linear-gradient(118deg,#f2f6ff 0%,#f7f6ff 54%,#fff6e9 100%);box-shadow:0 18px 48px #3d5f9b12;animation:linear-arrive .65s var(--ease) both}
.linear-hero:before{position:absolute;z-index:-1;right:18%;bottom:-240px;width:560px;height:390px;border:1px solid #5d83d315;border-radius:50%;content:"";transform:rotate(-18deg)}
.discovery-hero{min-height:400px;background:radial-gradient(ellipse at 82% 19%,#fff 0%,#fff0 30%),linear-gradient(118deg,#e8f1ff 0%,#f0edff 55%,#fff1d6 100%)}
.linear-hero-copy{position:relative;z-index:2;max-width:610px}
.linear-hero-copy>.eyebrow,.path-page-heading>.eyebrow{color:var(--accent);font-size:11px;letter-spacing:1.8px}
.linear-hero-copy h1{max-width:630px;margin:13px 0 12px;font-size:clamp(36px,5vw,58px);letter-spacing:-2.5px;line-height:1.02}
.linear-hero-copy>p{max-width:520px;color:var(--muted);font-size:16px;line-height:1.65}
.discovery-promise{display:flex;align-items:center;gap:11px;margin:22px 0 25px;color:#485b80;font-size:10px;font-weight:800;letter-spacing:1.1px}
.discovery-promise i{width:5px;height:5px;border-radius:50%;background:#ffb439}
.linear-cta{min-width:220px;min-height:54px;padding:15px 21px;border-radius:13px;font-size:14px;box-shadow:0 10px 22px #6554d927}
.linear-reassurance{margin-top:13px!important;font-size:11px!important}
.linear-hero-art{position:absolute;right:35px;bottom:-8px;width:300px;height:340px;display:grid;place-items:end center}
.linear-hero-art>img{position:relative;z-index:1;width:100%;height:100%;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 18px 18px #19356720);animation:parrot-greet 4.5s ease-in-out infinite}
.parrot-sun{position:absolute;right:19px;top:20px;width:202px;height:202px;border-radius:50%;background:linear-gradient(140deg,#fff8e2,#f1edff);box-shadow:0 0 0 15px #ffffff40}
.parrot-speech{position:absolute;z-index:3;right:3px;top:4px;padding:12px 15px;border-radius:16px 16px 3px 16px;background:#fff;color:#433897;box-shadow:0 8px 24px #30356216;font-size:12px;font-weight:750;transform:rotate(3deg);animation:speech-pop .6s .25s both}
.parrot-star{position:absolute;z-index:2;top:80px;right:0;color:#ffb438;font-size:34px;animation:star-twinkle 2.4s ease-in-out infinite}
.journey-progress{max-width:410px;margin:22px 0 22px}
.journey-progress-copy{display:flex;justify-content:space-between;margin-bottom:9px;color:var(--muted);font-size:10px;font-weight:750;letter-spacing:1px}
.journey-progress-copy strong{color:var(--accent);font-size:12px}
.journey-meter{height:8px;overflow:hidden;border-radius:99px;background:#dfe4f1}
.journey-meter span{display:block;width:var(--journey-progress);height:100%;border-radius:inherit;background:linear-gradient(90deg,#6554d9,#3982eb,#ffb338);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.learning-home-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:42px 0 18px}
.learning-home-heading .eyebrow{color:var(--muted)}
.learning-home-heading h2{margin-top:7px;font-size:24px;letter-spacing:-.8px}
.learning-home-heading>span{padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--paper);color:var(--muted);font-size:11px;font-weight:650;white-space:nowrap}
.learning-map{display:grid;grid-template-columns:1fr;gap:15px}
.map-level{position:relative;padding:22px 25px 20px;border:1px solid var(--line);border-radius:19px;background:var(--paper);box-shadow:var(--shadow);transition:transform .2s,border-color .2s,box-shadow .2s;animation:map-reveal .5s var(--ease) both}
.map-level:nth-child(2){animation-delay:.04s}.map-level:nth-child(3){animation-delay:.08s}.map-level:nth-child(4){animation-delay:.12s}.map-level:nth-child(5){animation-delay:.16s}.map-level:nth-child(6){animation-delay:.2s}
.map-level.is-open{border-color:#aaa0ed;box-shadow:0 10px 30px #6554d912}
.map-level.is-done{border-color:#d7eadd}
.map-level.is-locked{background:color-mix(in srgb,var(--paper) 94%,var(--bg))}
.map-level-head{display:flex;align-items:center;gap:13px}
.map-level-mark{width:38px;height:38px;display:grid;place-items:center;flex:none;border-radius:12px;background:#f0effb;color:var(--accent);font-size:13px;font-weight:800}
.map-level-mark svg{width:18px;height:18px}
.map-level.is-done .map-level-mark{background:var(--green-bg);color:var(--green)}
.map-level-head .eyebrow{color:var(--accent);font-size:10px}
.map-level-head h2{margin-top:3px;font-size:16px}
.map-level-status{margin-left:auto;color:var(--muted);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px}
.map-level-focus{margin:14px 0 15px 51px;color:var(--muted);font-size:12px}
.map-units{position:relative;display:grid;gap:8px;margin-left:18px}
.map-units:before{position:absolute;top:20px;bottom:20px;left:15px;width:2px;background:var(--line);content:""}
.map-unit{position:relative;z-index:1;display:grid;grid-template-columns:32px minmax(0,1fr) auto;align-items:center;gap:12px;min-height:64px;padding:8px 12px 8px 0;border-radius:12px;transition:background .2s}
.map-unit.is-current{background:linear-gradient(90deg,#f0edff,#f8f7ff);padding-left:7px;margin-left:-7px}
.map-unit-node{width:32px;height:32px;display:grid;place-items:center;border:2px solid var(--line);border-radius:50%;background:var(--paper);color:var(--muted);font-size:10px;font-weight:800}
.map-unit-node svg{width:15px;height:15px}
.map-unit.is-current .map-unit-node{border-color:var(--accent);background:var(--accent);color:#fff;box-shadow:0 0 0 5px #6554d918;animation:current-pulse 2.5s ease-in-out infinite}
.map-unit.is-done .map-unit-node{border-color:var(--green);background:var(--green);color:#fff}
.map-unit.is-assessed .map-unit-node{border-color:#c7c4d5;border-style:dashed;color:#9792a5}
.map-unit-copy{display:grid;gap:3px;min-width:0}
.map-unit-copy strong{font-size:12px}
.map-unit-copy>span{color:var(--muted);font-size:10px;line-height:1.45}
.map-unit-status{color:var(--muted);font-size:9px;font-weight:700;text-align:right;text-transform:uppercase;letter-spacing:.35px}
.map-unit.is-current .map-unit-status{color:var(--accent)}
.map-unit.is-done .map-unit-status{color:var(--green)}
.map-unit.is-assessed .map-unit-status{font-size:0}
.map-unit.is-assessed .map-unit-status:after{content:"avaliada";font-size:9px}
.learning-footnote{display:flex;justify-content:center;align-items:center;gap:7px;margin:24px auto 0;color:var(--muted);font-size:11px;text-align:center}
.learning-footnote svg{width:14px;height:14px}
.path-page-heading{margin-bottom:24px}
.path-page-heading h1{margin-top:8px;font-size:clamp(30px,4vw,42px);letter-spacing:-1.6px}
.path-page-heading p{margin-top:8px;color:var(--muted);font-size:14px}
.assessment-strip{margin:0 0 17px;padding:17px 19px;border:1px solid #dbe4fa;border-radius:15px;background:linear-gradient(110deg,#f2f6ff,#faf8ff);animation:assessment-arrive .45s var(--ease) both}
.assessment-strip-top{display:flex;justify-content:space-between;align-items:center}
.assessment-strip-top .eyebrow{color:var(--accent);font-size:10px}
.assessment-counter{color:var(--ink);font-size:13px;font-weight:800}
.assessment-counter span{color:var(--muted);font-size:10px;font-weight:550}
.assessment-band,.result-level-row{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px;margin:14px 0}
.assessment-level{display:grid;place-items:center;min-height:32px;border:1px solid var(--line);border-radius:9px;background:var(--paper);color:var(--muted);font-size:10px;font-weight:800;transition:color .25s,background .25s,transform .25s}
.assessment-level.current{border-color:var(--accent);background:var(--accent);color:#fff;box-shadow:0 5px 13px #6554d92a;transform:translateY(-2px)}
.assessment-level.passed{border-color:#d8eadd;background:var(--green-bg);color:var(--green)}
.assessment-note{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:11px}
.assessment-note strong{color:var(--ink)}
.assessment-pulse{width:8px;height:8px;border-radius:50%;background:#ffb338;box-shadow:0 0 0 4px #ffb33827;animation:assessment-pulse 1.7s ease-in-out infinite}
.level-reveal{position:relative;max-width:680px;margin:35px auto;padding:45px 38px 38px;overflow:hidden;border:1px solid #e0ddf4;border-radius:25px;background:radial-gradient(ellipse at 50% 0%,#f4f0ff,#fff 55%);box-shadow:0 22px 70px #4e438f16;text-align:center;animation:reveal-arrive .65s var(--ease) both}
.level-reveal-art{position:relative;width:110px;height:104px;margin:0 auto 16px}
.level-reveal-art img{position:absolute;z-index:1;inset:-14px -8px;width:126px;height:126px;object-fit:contain;animation:parrot-greet 3.8s ease-in-out infinite}
.reveal-ring{position:absolute;inset:7px;border:1px solid #b9aff0;border-radius:50%;box-shadow:0 0 0 10px #6554d90b,0 0 0 21px #6554d907;animation:ring-expand 1.8s ease-out both}
.level-reveal>.eyebrow{color:var(--accent)}
.level-reveal h1{max-width:540px;margin:11px auto;font-size:clamp(27px,4vw,39px);letter-spacing:-1.2px}
.level-reveal>p{max-width:480px;margin:0 auto;color:var(--muted);font-size:14px}
.reveal-evidence{display:flex;align-items:center;justify-content:center;gap:8px;margin:20px 0 6px}
.evidence-dot{width:11px;height:11px;border-radius:50%;background:var(--line)}
.evidence-dot.is-correct{background:var(--green);box-shadow:0 0 0 4px var(--green-bg)}
.evidence-dot.needs-practice{background:#ffb338;box-shadow:0 0 0 4px #ffb33824}
.reveal-evidence strong{margin-left:5px;color:var(--ink);font-size:12px}
.level-reveal .assessment-levels{max-width:420px;margin:17px auto 23px}
.level-reveal .btn{min-width:235px}
.level-reveal>.tiny{margin-top:13px;font-size:10px}
.linear-session-strip{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;padding:13px 16px;border:1px solid #e0ddf4;border-radius:13px;background:linear-gradient(105deg,#f5f3ff,#fff)}
.linear-session-strip>div{display:grid;gap:4px}
.linear-session-strip .eyebrow{color:var(--accent);font-size:9px}
.linear-session-strip strong{font-size:12px}
.linear-session-strip>span{color:var(--muted);font-size:10px;white-space:nowrap}
.learning-result{position:relative;max-width:640px;margin:20px auto;padding:40px 36px 32px;overflow:hidden;border:1px solid var(--line);border-radius:25px;background:var(--paper);box-shadow:0 22px 70px #2d31520c;text-align:center;animation:reveal-arrive .55s var(--ease) both}
.learning-result:before{position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,#6554d9,#3086eb,#ffb338);content:""}
.result-mascot{width:95px;height:95px;margin:0 auto 13px;border-radius:50%;background:linear-gradient(145deg,#eef3ff,#fff5dd)}
.result-mascot img{width:100%;height:100%;object-fit:contain;animation:parrot-greet 4s ease-in-out infinite}
.learning-result>.eyebrow{color:var(--accent);font-size:10px}
.learning-result h1{max-width:540px;margin:10px auto 9px;font-size:clamp(29px,4vw,40px);letter-spacing:-1.4px}
.result-description{max-width:500px;margin:0 auto;color:var(--muted);font-size:14px}
.level-result-orbit{position:relative;width:164px;height:164px;display:grid;align-content:center;justify-items:center;gap:4px;margin:25px auto 10px;border:1px solid #aaa0ed;border-radius:50%;background:radial-gradient(circle,#f4f1ff 0%,#fff 70%);box-shadow:0 0 0 10px #6554d90b,0 0 0 22px #6554d906;animation:badge-arrive .7s var(--ease) both}
.level-result-orbit strong{color:var(--accent);font-size:46px;letter-spacing:-2px}
.level-result-orbit>span:last-child{color:var(--muted);font-size:9px;font-weight:800;letter-spacing:1.1px}
.result-level-row{max-width:430px;margin:17px auto 22px}
.unit-result{display:flex;align-items:center;gap:13px;margin:24px 0 14px;padding:16px;text-align:left;border:1px solid var(--line);border-radius:14px;background:var(--bg)}
.unit-result-number{width:42px;height:42px;display:grid;place-items:center;flex:none;border-radius:12px;background:var(--green-bg);color:var(--green);font-weight:800}
.unit-result>div{display:grid;gap:4px;min-width:0}
.unit-result>div strong{font-size:12px}
.unit-result>div span{color:var(--muted);font-size:10px}
.unit-result-xp{margin-left:auto;color:var(--accent);font-size:11px;font-weight:800;white-space:nowrap}
.mascot-message{display:flex;align-items:center;gap:11px;margin:16px 0 20px;padding:12px 15px;border-radius:13px;background:linear-gradient(100deg,#f2f6ff,#fff8e9);text-align:left}
.mascot-message-mark{width:28px;height:28px;display:grid;place-items:center;flex:none;border-radius:9px;background:#fff;color:#f1a622;font-size:17px}
.mascot-message p{color:#46536b;font-size:12px;font-weight:650;line-height:1.5}
.learning-result .linear-cta{width:100%;max-width:390px}
.result-note{margin:12px auto 0;color:var(--muted);font-size:10px}
.linear-settings{max-width:760px}
.linear-settings h2{font-size:17px}
.linear-settings p{font-size:13px;color:var(--muted)}
.linear-settings .question-label{margin-top:15px}
@keyframes linear-arrive{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes map-reveal{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
@keyframes parrot-greet{0%,100%{transform:translateY(0) rotate(-1.3deg)}50%{transform:translateY(-7px) rotate(1.2deg)}}
@keyframes speech-pop{from{opacity:0;transform:translateY(6px) scale(.85) rotate(3deg)}to{opacity:1;transform:translateY(0) scale(1) rotate(3deg)}}
@keyframes star-twinkle{0%,100%{opacity:.5;transform:scale(.8) rotate(-8deg)}50%{opacity:1;transform:scale(1.12) rotate(8deg)}}
@keyframes current-pulse{0%,100%{box-shadow:0 0 0 4px #6554d918}50%{box-shadow:0 0 0 7px #6554d90a}}
@keyframes assessment-arrive{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes assessment-pulse{0%,100%{box-shadow:0 0 0 3px #ffb33820}50%{box-shadow:0 0 0 6px #ffb33816}}
@keyframes reveal-arrive{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes ring-expand{from{opacity:.2;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
@keyframes badge-arrive{from{opacity:0;transform:scale(.75) rotate(-12deg)}70%{transform:scale(1.04) rotate(2deg)}to{opacity:1;transform:scale(1) rotate(0)}}
@media(prefers-color-scheme:dark){
 .linear-hero{border-color:#373849;background:linear-gradient(118deg,#202b41,#28243a 54%,#393024)}
 .discovery-hero{background:radial-gradient(ellipse at 82% 19%,#343045 0%,#34304500 30%),linear-gradient(118deg,#1f2e46,#292540 55%,#393024)}
 .parrot-sun{background:linear-gradient(140deg,#424055,#37344a);box-shadow:0 0 0 15px #ffffff0c}
 .parrot-speech{background:#292638;color:#d3caff}
 .map-level.is-open{border-color:#70649f}
 .map-level.is-done{border-color:#355342}
 .map-unit.is-current{background:linear-gradient(90deg,#302b49,#292638)}

}

 .linear-hero{grid-template-columns:minmax(0,1fr) 215px;min-height:310px;padding:32px 29px}
 .discovery-hero{min-height:365px}
 .linear-hero-art{right:-8px;width:240px;height:290px}
 .parrot-sun{right:11px;top:23px;width:160px;height:160px}
 .parrot-speech{right:2px;top:4px;font-size:10px}
 .linear-hero-copy h1{font-size:clamp(32px,6vw,47px)}
 .map-level{padding:19px 18px}

@media(max-width:560px){
 .topbar{height:66px}

 .discovery-hero{min-height:480px}
 .linear-hero-copy{max-width:100%}
 .linear-hero-copy h1{max-width:420px;font-size:39px;letter-spacing:-1.8px}
 .linear-hero-copy>p{max-width:350px;font-size:13px}
 .linear-hero-art{right:5px;bottom:-43px;width:190px;height:220px;opacity:.94}
 .parrot-sun{right:8px;top:7px;width:128px;height:128px}
 .parrot-speech{right:0;top:-2px;padding:8px 10px;font-size:9px}
 .parrot-star{top:44px;right:0;font-size:26px}
 .linear-cta{min-width:0;min-height:50px}
 .learning-home-heading{align-items:flex-start;flex-direction:column;margin:30px 0 14px}
 .learning-home-heading h2{font-size:20px}
 .map-level{padding:17px 14px}
 .map-level-status{font-size:8px;letter-spacing:0}
 .map-level-focus{margin-left:0}
 .map-units{margin-left:6px}
 .map-unit{grid-template-columns:30px minmax(0,1fr);gap:9px;min-height:63px}
 .map-unit-node{width:29px;height:29px}
 .map-unit-status{grid-column:2;margin-top:-6px;text-align:left}
 .map-unit-copy strong{font-size:11px}
 .map-unit-copy>span{font-size:9px}
 .learning-footnote{align-items:flex-start;max-width:360px;font-size:10px}
 .assessment-strip{padding:14px 13px}
 .assessment-band,.result-level-row{gap:4px}
 .assessment-level{min-height:29px;font-size:9px}
 .assessment-note{align-items:flex-start;font-size:10px}
 .assessment-note .assessment-pulse{margin-top:3px;flex:none}
 .level-reveal,.learning-result{padding:30px 20px 24px;border-radius:20px}
 .level-reveal h1{font-size:29px}
 .level-reveal>p{font-size:12px}

 .journey-meter span{transition:none!important}
}

/* Mobile-first interface and immersive learning mode. */
:root{--bg:#f5f7fb;--paper:#fff;--ink:#16243c;--muted:#607087;--line:#e3e9f1;--accent:#215ed6;--accent-dark:#184bb0;--soft:#edf3ff;--green:#147a56;--green-bg:#e9f6ef;--red:#b43e50;--red-bg:#fff0f2;--shadow:0 4px 24px #132c5010;--activity-actions-height:90px;--keyboard-offset:0px;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,a,input,textarea,summary{touch-action:manipulation}
button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #91b9ff;outline-offset:4px}
.btn{min-height:52px;border-radius:14px;font-size:15px;font-weight:650;letter-spacing:-.15px}
.btn:hover{transform:none}.btn:active{transform:scale(.985)}.btn.ghost{color:var(--muted)}
.icon-btn{min-width:46px;min-height:46px;border-radius:14px}
.text-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 0;font-size:13px;font-weight:650}
.text-btn svg{width:16px;height:16px}.eyebrow{font-size:10px;letter-spacing:1.3px;line-height:1.6}
.shell{max-width:1440px}.sidebar{width:216px;padding:32px 20px;background:var(--paper)}
.sidebar .brand{font-size:27px}.tagline{margin:8px 0 36px 45px}.sidebar-bottom .mini-note{display:none}
.main{margin-left:216px}.content{max-width:1016px;padding:32px 40px 64px}
.topbar{height:80px;padding:0 40px;background:transparent;border:0}
.breadcrumb{font-size:12px}.breadcrumb span{font-weight:600}
.stat-inline{padding:8px 12px;border:1px solid var(--line);border-radius:99px;background:var(--paper);font-size:12px}
.nav button{min-height:50px;font-size:14px;border-radius:13px}.nav button.active{box-shadow:inset 3px 0 var(--accent)}
.home-intro{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 22px}
.home-intro .eyebrow{color:var(--muted)}.home-intro h2{margin-top:5px;font-size:24px;letter-spacing:-.7px}

/* One prominent next step; the mascot supports the action. */

.linear-hero-copy>p{color:#cedcf0;font-size:15px;line-height:1.65;max-width:460px}

.linear-hero .linear-cta:hover{background:#edf4ff}.linear-reassurance{margin-top:12px!important;color:#afc7e6!important;font-size:11px!important;line-height:1.5!important}

.linear-hero-art>img{filter:drop-shadow(0 18px 20px #06152c45);animation:none}
.parrot-sun{width:174px;height:174px;top:32px;right:12px;border:1px solid #6a9ad55c;background:#3777be35;box-shadow:0 0 0 20px #3d7dc012}

.discovery-promise i{width:3px;height:3px;background:#ffcc67}
.journey-progress{margin:22px 0;max-width:400px}.journey-progress-copy{font-size:10px;letter-spacing:1px;color:#c4d7f2}.journey-progress-copy strong{font-size:12px;color:#fff}
.journey-meter{height:5px;background:#ffffff25}.journey-meter span{background:#77b4ff;transition:width .3s ease}
.learning-home-heading{align-items:center;flex-direction:row;gap:12px;margin:28px 0 12px}.learning-home-heading h2{font-size:18px;letter-spacing:-.4px;margin:0}
.journey-onboarding{list-style:none;margin:0;padding:4px 22px;background:var(--paper);border:1px solid var(--line);border-radius:20px}
.journey-onboarding li{display:flex;align-items:center;gap:16px;padding:21px 0}.journey-onboarding li+li{border-top:1px solid var(--line)}
.journey-onboarding li>span{font-size:12px;font-weight:750;color:var(--accent);font-variant-numeric:tabular-nums}
.journey-onboarding strong{font-size:14px;font-weight:650}.journey-onboarding p{margin-top:3px;font-size:13px;color:var(--muted)}
.learning-footnote{align-items:flex-start;gap:7px;margin:24px auto 0;font-size:11px;line-height:1.6;max-width:none}.learning-footnote svg{width:15px;height:15px;margin-top:1px}
.path-page-heading{margin-bottom:24px}.path-page-heading h1{font-size:36px;line-height:1.15;letter-spacing:-1.2px}.path-page-heading p{margin-top:12px;max-width:520px;font-size:15px}
.path-continue{display:flex;justify-content:space-between;align-items:center;gap:18px;margin:0 0 24px;padding:18px 20px;border:1px solid var(--line);border-radius:18px;background:var(--paper)}
.path-continue>span{font-size:13px;color:var(--muted)}.path-continue .btn{flex:none}

/* Native details keep the full path compact and keyboard accessible. */
.learning-map{gap:12px}.map-level{padding:0;border:1px solid var(--line);border-radius:18px;background:var(--paper);overflow:hidden;box-shadow:none;animation:none}
.map-level.is-open{border-color:var(--line);box-shadow:none}.map-level[open].is-open{border-color:#b8ccef;box-shadow:0 4px 20px #143a6c06}
.map-level-head{display:flex;align-items:center;gap:12px;min-height:88px;padding:20px;cursor:pointer;list-style:none}
.map-level-head::-webkit-details-marker{display:none}.map-level-head:focus-visible{outline-offset:-4px;border-radius:18px}
.map-level-mark{width:43px;height:43px;background:var(--soft);border-radius:13px;font-size:14px}
.map-level-mark svg{width:19px;height:19px}.map-level-heading{min-width:0;display:grid;gap:3px}
.map-level-heading .eyebrow{color:var(--muted);font-size:9px;letter-spacing:.8px}.map-level-heading strong{font-size:15px;line-height:1.4;letter-spacing:-.25px}
.map-level-status{margin-left:auto;font-size:11px;white-space:nowrap;text-transform:none;letter-spacing:0}
.map-chevron{color:var(--muted);display:grid;place-items:center;flex:none}.map-chevron svg{width:16px;height:16px;transform:rotate(90deg);transition:transform .18s}.map-level[open] .map-chevron svg{transform:rotate(-90deg)}
.map-level-focus{padding:0 20px 15px;margin:0;font-size:13px}.map-units{padding:0 20px 16px;margin:0;gap:4px}.map-units:before{display:none}
.map-unit{grid-template-columns:30px minmax(0,1fr);column-gap:12px;padding:14px 10px;min-height:0}
.map-unit:before{position:absolute;left:24px;top:44px;bottom:-18px;width:1px;background:var(--line);content:""}.map-unit:last-child:before{display:none}
.map-unit-node{align-self:start;position:relative;z-index:1;width:30px;height:30px;border-width:1px;font-size:11px}
.map-unit-copy{gap:4px}.map-unit-copy strong{font-size:14px;line-height:1.4;font-weight:650}.map-unit-copy>span{font-size:12px;line-height:1.5}
.map-unit-status{grid-column:2;margin-top:7px;text-align:left;font-size:10px;letter-spacing:.5px}
.map-unit.is-current{background:var(--soft);padding:14px 10px;margin:0}.map-unit.is-current .map-unit-node{background:var(--accent);border-color:var(--accent);box-shadow:none;animation:none}
.map-unit.is-done .map-unit-node{background:var(--green-bg);border-color:transparent;color:var(--green)}.map-unit.is-assessed .map-unit-status{font-size:10px}.map-unit.is-assessed .map-unit-status:after{display:none}.map-unit.is-locked .map-unit-copy strong{color:var(--muted)}

/* Focus mode removes navigation from both layout and keyboard order. */
body.activity-focus{background:var(--paper)}
.activity-focus .sidebar,.activity-focus .topbar{display:none!important}
.activity-focus .shell{max-width:none}.activity-focus .main{margin:0;min-height:100svh}.activity-focus .content{max-width:none;margin:0;padding:0}
.activity-focus #app.screen-enter{animation:none;transform:none}
.exercise-wrap{max-width:760px;margin:0 auto;min-height:100svh;padding:0 24px calc(var(--activity-actions-height) + 28px)}
.focus-header{position:sticky;top:0;z-index:25;display:flex;align-items:center;gap:18px;padding:calc(16px + env(safe-area-inset-top,0px)) 0 16px;background:var(--paper);border-bottom:1px solid var(--line)}
.focus-exit{border:0;background:var(--bg);color:var(--muted);flex:none}.focus-exit svg{width:20px;height:20px}
.focus-progress{min-width:0;flex:1}.focus-progress-label{display:flex;justify-content:space-between;gap:12px;margin-bottom:10px;color:var(--muted);font-size:12px;font-weight:550}
.focus-progress-label>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.focus-progress-label>span:last-child{flex:none;font-size:11px;font-variant-numeric:tabular-nums}
.focus-meter{height:6px;overflow:hidden;border-radius:20px;background:var(--line)}.focus-meter>span{display:block;height:100%;background:var(--accent);border-radius:inherit;transition:width .25s ease}
.exercise-focus .question-card{border:0;box-shadow:none;background:transparent;border-radius:0;padding:32px 0 0;margin:0;overflow:visible}
.focus-activity-label{display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--muted);font-size:12px;font-weight:600;margin-bottom:12px}
.focus-activity-label>span:first-child{display:flex;align-items:center;gap:8px}.focus-activity-label svg{width:17px;height:17px;color:var(--accent)}.focus-activity-label>span:last-child{border-radius:7px;background:var(--soft);color:var(--accent);padding:4px 8px;font-size:10px;font-weight:750}
.game-stage #activity-title{font-size:30px;letter-spacing:-1px;line-height:1.2;margin:0 0 24px;outline:0}
.focus-stage{font-size:16px;overflow-wrap:anywhere}.focus-stage .scene-label{font-size:14px;line-height:1.65;margin-bottom:18px}
.focus-stage .game-question{font-size:21px!important;line-height:1.45!important;letter-spacing:-.4px!important;margin:22px 0 16px!important}
.focus-stage .question-label{font-size:13px;font-weight:550;margin:20px 0 9px}
.focus-stage .question-input{font-size:17px;line-height:1.6;min-height:116px;border:1.5px solid var(--line);border-radius:15px;padding:16px;background:var(--bg);resize:vertical;scroll-margin-top:110px;scroll-margin-bottom:calc(var(--activity-actions-height) + 24px)}
.focus-stage .question-input:focus{border-color:var(--accent);outline:3px solid var(--soft);outline-offset:1px;background:var(--paper)}.focus-stage .question-input:disabled{opacity:1;color:var(--muted);-webkit-text-fill-color:var(--muted)}
.focus-stage .chat-shell{border-radius:16px;margin:18px 0}.focus-stage .chat-header{padding:13px 16px}.focus-stage .chat-companion{display:none}
.focus-stage .chat-body{padding:18px;gap:12px}.focus-stage .bubble{font-size:16px;line-height:1.6;max-width:95%;padding:12px 15px}.focus-stage .character{border-radius:50%;width:34px;height:34px}.focus-stage .chat-header small{font-size:11px}
.focus-stage .artifact,.focus-stage .paper-doc{border-radius:16px;margin:18px 0}.focus-stage .artifact-head{font-size:11px;letter-spacing:.6px;padding:14px 18px}.focus-stage .artifact-body{font-size:16px;line-height:1.8;padding:20px}
.focus-stage .paper-doc{padding:20px}.focus-stage .red-copy{font-size:18px;line-height:2.4}.focus-stage .red-token{min-height:44px;padding:5px 3px}.focus-stage .red-editor{border:0;padding:0}
.focus-stage .context{margin:18px 0;padding:16px 20px;background:var(--bg);border-left:3px solid #aac5f5;font-size:18px;border-radius:0 12px 12px 0}
.focus-stage .tone-context{margin:18px 0;grid-template-columns:1fr 24px 1fr}.focus-stage .tone-tag{font-size:10px;letter-spacing:.5px;padding:13px 10px}
.focus-stage .options{gap:10px;margin:20px 0}.focus-stage .option{padding:15px;font-size:15px;line-height:1.55;min-height:58px;border-radius:14px;align-items:flex-start}.focus-stage .option:hover:not(:disabled){border-color:var(--accent);background:var(--soft)}
.focus-stage .option:disabled{opacity:.65}.focus-stage .option-key{flex:none;min-width:26px;height:26px;margin-top:0;font-size:11px;background:var(--bg)}
.focus-stage .surgery-line{gap:7px;line-height:1.8;border-radius:16px;padding:18px;font-size:17px}.focus-stage .slot{min-width:44px;min-height:46px;padding:8px;border-radius:9px}.focus-stage .surgery-word{font-size:19px;border-radius:12px;padding:10px 24px}
.focus-lesson{margin-top:26px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}.focus-lesson summary{display:flex;align-items:center;gap:8px;cursor:pointer;list-style:none;min-height:52px;font-size:12px;font-weight:600}
.focus-lesson summary::-webkit-details-marker{display:none}.focus-lesson summary svg{width:16px;height:16px}.focus-lesson summary span{margin-left:auto;font-size:18px}.focus-lesson[open] summary span{transform:rotate(45deg)}.focus-lesson p{margin:0 0 12px}.focus-lesson p[lang=en]{color:var(--ink)}
.focus-feedback{scroll-margin-top:110px;scroll-margin-bottom:calc(var(--activity-actions-height) + 24px);outline:0}.focus-feedback .feedback{padding:18px;border-radius:16px;margin-top:24px}.focus-feedback .feedback p{font-size:14px}.focus-feedback .feedback .answer{font-size:17px}.focus-feedback .feedback-title{font-size:14px}
.focus-actions{position:fixed;z-index:30;bottom:var(--keyboard-offset);left:0;right:0;background:var(--paper);border-top:1px solid var(--line);padding:14px 24px calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 -5px 24px #16243c04}
.focus-actions-inner{max-width:712px;margin:auto;display:flex;align-items:center;gap:14px}.focus-actions .btn{min-height:54px}.focus-actions #primary-action{flex:1}.focus-actions .btn.ghost{min-width:64px;padding:12px 8px}.focus-actions .btn.correct{background:var(--green);color:#fff}
.focus-action-hint{flex:1;text-align:right;font-size:12px;line-height:1.5;color:var(--muted)}.keyboard-open .focus-actions{padding-bottom:12px}.keyboard-open .focus-header{position:relative}
.exercise-focus .toast{bottom:calc(var(--activity-actions-height) + 14px)}.storage-warning{position:relative;z-index:40;font-size:13px}.storage-warning button{min-height:44px}

/* Checkpoints and results use the same focused surface. */
.focus-checkpoint{padding-bottom:32px}.level-reveal,.learning-result{max-width:620px;margin:32px auto;padding:32px 24px;text-align:center;background:var(--paper);border:0;box-shadow:none;overflow-wrap:anywhere;animation:none}
.learning-result:before{display:none}.level-reveal-art,.result-mascot{width:100px;height:100px;margin:0 auto 20px;border-radius:50%;background:var(--soft);position:relative}

.reveal-evidence{gap:10px;margin:24px 0;font-size:13px}.evidence-dot{width:10px;height:10px}.evidence-dot.is-correct,.evidence-dot.needs-practice{box-shadow:none}

.level-result-orbit strong{font-size:44px}.level-result-orbit>span:last-child{font-size:9px;color:var(--muted)}
.unit-result{padding:18px;border-radius:16px;margin:24px 0}.unit-result-number{width:40px;height:40px;border-radius:12px;background:var(--soft);color:var(--accent)}.unit-result>div strong{font-size:14px}.unit-result>div span{font-size:12px}.unit-result-xp{font-size:12px;color:var(--green)}
.mascot-message{padding:16px;background:var(--bg);border-radius:14px;margin:20px 0 24px}.mascot-message-mark{background:none;color:#b07b22;font-size:20px}.mascot-message p{font-size:13px;color:var(--muted);font-weight:400}
.result-note{font-size:12px!important;margin:16px auto 0!important}.result-top{max-width:680px;margin:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 24px 0}.result-top .text-btn{color:var(--muted)}

 :root{--bg:#101925;--paper:#172230;--ink:#e8eff8;--muted:#a4b3c7;--line:#2b3b4f;--accent:#85b1ff;--accent-dark:#a4c5ff;--soft:#233753;--green:#79cba6;--green-bg:#1b382e;--red:#f2a0ae;--red-bg:#3e2630;--shadow:none}
 .btn{background:#326fe1;color:#fff}.btn:hover{background:#407eea}.btn.secondary{background:var(--paper);color:var(--ink)}.btn.ghost{background:transparent;color:var(--muted)}
 .linear-hero{border-color:#294872}.map-level[open].is-open{border-color:#426289}.map-unit.is-current .map-unit-node,.assessment-level.current{background:#326fe1;color:#fff;border-color:#326fe1}.focus-actions .btn.correct{background:#237b58;color:#fff}.focus-stage .context{border-color:#456b9e}.level-result-orbit{border-color:#426289}

/* Help and deliberate correction stay inside the current learning step. */
.learning-help{display:grid;gap:0;margin-top:18px;border-top:1px solid var(--line)}
.learning-help details+details{border-top:1px solid var(--line)}
.learning-help summary{display:flex;align-items:center;gap:8px;min-height:48px;list-style:none;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted)}
.learning-help summary::-webkit-details-marker{display:none}.learning-help summary svg{width:17px;height:17px}.learning-help summary:after{content:'+';margin-left:auto;font-size:18px;font-weight:400}.learning-help details[open] summary:after{content:'−'}
.learning-help details p{padding:0 0 14px;color:var(--ink);font-size:14px;line-height:1.65}.learning-help details .help-note{color:var(--muted);font-size:12px}.learning-help .question-hint summary{color:var(--accent)}
.answer-comparison{margin:14px 0;padding:12px;border-radius:10px;background:var(--paper);border:1px solid var(--line)}
.answer-comparison>span,.feedback-answer-label{display:block;color:var(--muted);font-size:11px;font-weight:650}
.answer-comparison p{margin-top:5px;font-size:15px!important;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink)}
.feedback-explanation{padding-top:10px;border-top:1px solid color-mix(in srgb,var(--muted) 15%,transparent)}
.feedback .skip-explanation{margin-top:12px;font-size:12px!important;color:var(--muted)}
.repair-open{margin:8px 0 0;text-align:left;min-height:48px}
.repair-box{margin-top:18px;padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--bg)}
.repair-box .question-label{margin:0 0 7px;font-weight:650;color:var(--ink);font-size:14px}
.repair-note,.repair-status{font-size:12px;color:var(--muted);line-height:1.6}.repair-status{margin:10px 0}
.repair-box .question-input{font-size:16px;min-height:100px;padding:14px;margin:12px 0;scroll-margin-top:110px;scroll-margin-bottom:calc(var(--activity-actions-height) + 24px);border-radius:12px}
.repair-box .btn{width:100%;min-height:48px;font-size:14px}
.repair-success{margin-top:16px;padding:16px;border:1px solid var(--line);border-radius:12px;color:var(--green);font-size:14px;line-height:1.6;background:var(--green-bg)}
.repair-success small{display:block;margin-top:5px;font-size:12px;color:var(--muted)}
.learning-recap{text-align:left;margin:20px 0;padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--paper)}
.learning-recap h2{font-size:15px;letter-spacing:-.2px}.learning-recap>p{margin-top:8px;font-size:14px;color:var(--muted)}
.learning-recap h3{font-size:12px;margin-top:18px;color:var(--accent);letter-spacing:0}.learning-recap ul{padding-left:18px;margin:8px 0 0;display:grid;gap:8px}.learning-recap li{font-size:13px;line-height:1.6;color:var(--muted)}
@media(max-width:820px){.repair-box{padding:16px}.focus-activity-label>span:last-child{white-space:nowrap}.learning-recap{padding:16px}}

<body>
<div class="shell"><aside class="sidebar"><a class="brand" href="#home" aria-label="Fluent, início"><span class="brand-mark"><img src="assets/favicon.png" alt="" width="35" height="35"></span>fluent<small>.</small></a><p class="tagline">Inglês em movimento.</p><nav class="nav" aria-label="Navegação principal" id="nav"></nav><div class="sidebar-bottom"><div class="mini-note"><span class="eyebrow" style="color:var(--accent)">Menos tempo. Mais inglês.</span><p>3 minutos de prática.<br>Uma habilidade de cada vez.</p></div><div class="profile"><div class="avatar">EU</div><div><strong style="font-size:12px">Seu espaço de estudo</strong><p class="tiny muted">Salvo neste dispositivo</p></div></div></div></aside><div class="main"><header class="topbar"><div class="breadcrumb">Seu aprendizado <span id="crumb">/ Visão geral</span></div><a class="brand mobile-brand" href="#home"><span class="brand-mark"><img src="assets/favicon.png" alt="" width="35" height="35"></span>fluent<small>.</small></a><div class="top-stats"><div class="stat-inline"><span data-icon="flame"></span><b id="streak-top">0</b><span>dias</span></div><div class="stat-inline"><span data-icon="bolt"></span><b id="xp-top">0</b> XP</div><button id="sound" class="icon-btn" aria-label="Ativar som" title="Ativar som"></button></div></header><div id="storage-warning" class="storage-warning" role="status" hidden>O navegador bloqueou o armazenamento. Exporte seu código antes de fechar.</div><main class="content" id="app"></main></div></div><canvas id="confetti" aria-hidden="true"></canvas><div id="announcer" class="sr-only" aria-live="polite"></div><dialog id="modal"><h2 id="modal-title"></h2><p id="modal-text"></p><div class="button-row"><button class="btn secondary" id="modal-cancel">Cancelar</button><button class="btn" id="modal-ok">Continuar</button></div></dialog>
<script>
'use strict';
// Original practice material. Can-do objectives are pedagogical adaptations, not official exam items.
const LEVELS=['A1','A2','B1','B2','C1','C2'];
const LEVEL_NAMES=['Primeiras conexões','Além do básico','Conversas com confiança','Ideias que conectam','Precisão e influência','Domínio e nuance'];
const UNITS=[];
// Item fields: type, prompt, accepted answers (| separated), explanation, rule, optional context/options.
function unit(level,title,canDo,lesson,example,rows){const ui=UNITS.length;UNITS.push({id:ui,level,title,canDo,lesson,example,items:rows.map((r,j)=>({id:`u${ui}q${j}`,unit:ui,level,type:r[0],prompt:r[1],answers:r[2].split('|'),why:r[3],rule:r[4],context:r[5]||'',options:r[6]||[]}))});}
unit('A1','Prazer, este sou eu','Apresentar-se e trocar informações pessoais simples.','Use be para dizer quem você é, sua origem e sua idade.','I am Brazilian. I am 25 years old.',[
['translate','Sou brasileiro.','I am Brazilian','Nacionalidades usam be e começam com letra maiúscula.','I + am; you/we/they + are; he/she/it + is.'],
['transform','Corrija a frase.','I am 20 years old|I am twenty years old|I am 20|I am twenty','Em inglês, idade usa be, não have.','Idade: be + número (+ years old).','I have 20 years.'],
['gap','Complete com uma palavra.','is','She é terceira pessoa do singular.','She/he/it + is.','My colleague ___ from Canada.'],
['order','Monte a pergunta.','Where are you from','Inverta are e you em perguntas.','Wh-word + be + sujeito.'],
['translate','Meu nome é Ana.','My name is Ana','My indica posse; name é singular.','My name is + nome.'],
['gap','Complete a apresentação.','an','Engineer começa com som de vogal.','Use an antes de som de vogal.','I am ___ engineer.'],
['transform','Escreva na forma negativa.','They are not from Brazil','Not vem depois de are.','Sujeito + be + not.','They are from Brazil.'],
['choice','Você quer saber como escrever o nome de alguém. Escolha a pergunta.','How do you spell your name','Spell significa soletrar.','How do you spell + palavra/nome?','',['How do you spell your name?','How old is your name?','Where is your name?']]
]);
unit('A1','Seu dia, em inglês','Descrever rotinas de trabalho e hábitos cotidianos.','No presente simples, acrescente -s ao verbo com he, she e it.','I work from home. She works in an office.',[
['translate','Eu trabalho em casa.','I work from home|I work at home','Work from home descreve trabalho remoto.','I/you/we/they + verbo na forma base.'],
['gap','Complete com a forma de start.','starts','The meeting é singular, como it.','He/she/it + verbo com -s.','The meeting ___ at nine every day.'],
['transform','Troque I por She.','She goes to work by bus','Go recebe -es com she.','Go → goes na terceira pessoa.','I go to work by bus.'],
['order','Monte a pergunta sobre rotina.','Do you speak English','Use do para perguntar com you.','Do + sujeito + verbo base?'],
['translate','Eu não bebo café.','I do not drink coffee','A negativa no presente usa do not.','Do not + verbo base.'],
['gap','Complete com uma palavra.','does','He pede does em perguntas.','Does + he/she/it + verbo base?','What time ___ he finish work?'],
['transform','Corrija a frase.','She does not work on Sundays','Depois de does not, retire o -s de works.','Does not + verbo base.','She does not works on Sundays.'],
['choice','Leia: “Luis starts at 8 a.m. and finishes at 4 p.m.” Quando ele termina?','At four in the afternoon','4 p.m. é quatro da tarde.','A.m. indica antes do meio-dia; p.m., depois.','',['At eight in the morning','At four in the afternoon','At four in the morning']]
]);
unit('A1','Café, bilhete, por favor','Pedir produtos e informações simples durante uma viagem.','Use Can I have…? para fazer pedidos simples e educados.','Can I have a coffee, please?',[
['translate','Posso pedir uma água, por favor?','Can I have some water please|Can I have a water please|May I have some water please|Could I have some water please','Some water funciona para uma quantidade não especificada.','Can I have + pedido + please?'],
['gap','Complete a pergunta de preço.','much','How much pergunta o preço.','How much is + item singular?','How ___ is a ticket?'],
['order','Monte a pergunta.','Where is the train station','Station é singular e usa is.','Where is + lugar singular?'],
['translate','Eu preciso de uma passagem para Londres.','I need a ticket to London|I need a ticket for London','Use a antes de ticket, que é contável.','Need + a/an + substantivo singular.'],
['gap','Complete com a ou an.','a','Hotel começa com som de consoante em inglês.','A antes de som de consoante.','There is ___ hotel near the station.'],
['transform','Passe para o plural, incluindo o número two.','There are two restaurants here','No plural, there is vira there are.','There are + substantivo plural.','There is a restaurant here.'],
['translate','O banheiro fica à esquerda.','The bathroom is on the left|The restroom is on the left|The toilet is on the left','On the left indica posição à esquerda.','On the left / on the right.'],
['choice','“Breakfast is served from 7 to 10.” Você chega às 9. Pode tomar café?','Yes breakfast is still available','9 está dentro do intervalo de 7 a 10.','From…to… indica início e fim.','',['No breakfast starts at 10','Yes breakfast is still available','No breakfast ends at 7']]
]);
unit('A2','Histórias de ontem','Relatar atividades e acontecimentos passados de forma simples.','Use o passado simples para ações concluídas. Após did ou did not, use o verbo base.','I went yesterday. I did not go today.',[
['translate','Eu visitei um cliente ontem.','I visited a client yesterday|I visited a customer yesterday|Yesterday I visited a client','Visited é o passado regular de visit.','Verbos regulares: verbo + -ed.'],
['gap','Complete com o passado de go.','went','Go tem passado irregular.','Go → went.','We ___ to Lisbon last month.'],
['transform','Transforme em pergunta.','Did you send the email','Sent volta à forma send depois de did.','Did + sujeito + verbo base?','You sent the email.'],
['order','Monte a frase.','I did not see your message','A negativa usa did not + see.','Did not + verbo base.'],
['translate','A reunião começou às nove.','The meeting started at nine|The meeting began at nine|The meeting started at 9|The meeting began at 9','Started e began são passados válidos.','At + horário.'],
['gap','Complete com o passado de be.','were','You usa were no passado de be.','You/we/they + were.','Where ___ you last night?'],
['transform','Corrija a frase.','I did not have time yesterday','Depois de did not, usamos have.','Did not + verbo base.','I did not had time yesterday.'],
['choice','“I missed the bus, so I took a taxi.” Por que a pessoa pegou um táxi?','Because they missed the bus','So introduz a consequência; perder o ônibus foi a causa.','Causa + so + resultado.','',['Because they missed the bus','Because taxis were free','Because the bus was early and they caught it']]
]);
unit('A2','O que vem a seguir','Descrever planos e intenções para o futuro próximo.','Use be going to + verbo base para planos já decididos.','We are going to book a hotel.',[
['translate','Vou estudar inglês amanhã.','I am going to study English tomorrow|Tomorrow I am going to study English','Going to expressa uma intenção já definida.','Be + going to + verbo base.'],
['gap','Complete com uma palavra.','are','We concorda com are.','We/you/they + are going to.','We ___ going to travel next week.'],
['transform','Transforme em pergunta.','Is she going to call the client','Inverta is e she.','Be + sujeito + going to + verbo?','She is going to call the client.'],
['order','Monte a frase.','They are going to stay for three days','For indica duração.','For + período de tempo.'],
['translate','Não vamos alugar um carro.','We are not going to rent a car|We are not going to hire a car','Rent e hire são variantes usuais para alugar.','Be + not + going to.'],
['gap','Complete com uma palavra.','to','A estrutura inclui to antes do verbo.','Going to + verbo base.','What are you going ___ do this weekend?'],
['transform','Reescreva usando going to.','I am going to visit my sister on Saturday','Um plano decidido pode ser expresso com going to.','I am going to + verbo.','I plan to visit my sister on Saturday.'],
['choice','“I have booked a room for Friday.” Qual é o plano?','Stay at a hotel on Friday','Booked a room indica reserva de acomodação.','Book = reservar.','',['Stay at a hotel on Friday','Buy a house on Friday','Work at a hotel every Friday']]
]);
unit('A2','Escolha com confiança','Comparar opções de hospedagem, transporte e produtos.','Adjetivos curtos usam -er; muitos adjetivos longos usam more.','This hotel is cheaper than that one.',[
['translate','Este hotel é mais barato que aquele.','This hotel is cheaper than that one|This hotel is cheaper than that hotel','Cheap é curto e recebe -er.','Adjetivo + -er + than.'],
['gap','Complete usando comfortable.','more comfortable','Comfortable usa more para comparar.','More + adjetivo longo + than.','This seat is ___ than mine.'],
['transform','Compare usando better.','The train is better than the bus','Good tem comparativo irregular: better.','Good → better → best.','The train is good. The bus is not as good.'],
['order','Monte a comparação.','Flying is faster than driving','Fast recebe -er, e than conecta a comparação.','Faster than = mais rápido que.'],
['translate','Este é o melhor restaurante da cidade.','This is the best restaurant in the city|This is the best restaurant in town','Use the antes do superlativo best.','The + superlativo.'],
['gap','Complete com o comparativo de easy.','easier','Em easy, troque y por i antes de -er.','Consoante + y → -ier.','The new app is ___ to use than the old one.'],
['transform','Corrija a comparação.','This room is bigger than mine','Big forma bigger; não use more bigger.','Big → bigger; não duplique o comparativo.','This room is more bigger than mine.'],
['choice','“A costs £40; B costs £60. Both include breakfast.” Qual afirmação é correta?','A is cheaper than B','£40 é menos que £60.','Cheaper compara preços menores.','',['A is cheaper than B','B is cheaper than A','A and B cost the same']]
]);
unit('B1','Experiência que conta','Descrever experiências e relacioná-las à situação atual.','Use present perfect para experiências e situações que continuam. Since marca o início; for, a duração.','I have worked here since 2020.',[
['translate','Eu trabalho aqui desde 2020.','I have worked here since 2020|I have been working here since 2020','A situação começou no passado e continua; evite I work here since.','Have/has + particípio; since + início.'],
['gap','Complete com uma palavra.','ever','Ever pergunta se algo ocorreu em qualquer momento até agora.','Have you ever + particípio?','Have you ___ worked abroad?'],
['transform','Reescreva com present perfect, usando never.','I have never flown before','Uma experiência até o presente usa present perfect.','Have never + particípio.','This is my first flight. I ___ before.'],
['order','Monte a frase.','She has already sent the proposal','Already costuma vir entre has e o particípio.','Has already + particípio.'],
['translate','Ainda não terminei o relatório.','I have not finished the report yet|I have not yet finished the report','Yet é comum no final de negativas com present perfect.','Have not + particípio + yet.'],
['gap','Complete com since ou for.','for','Three years é uma duração.','For + duração; since + ponto inicial.','We have known each other ___ three years.'],
['transform','Corrija a frase.','I saw that film yesterday|I saw that movie yesterday','Yesterday define um passado concluído, então use past simple.','Tempo passado definido → past simple.','I have seen that film yesterday.'],
['choice','“Maya has lost her passport, so she cannot check in.” O que se sabe?','She does not have her passport now','O present perfect conecta a perda ao problema atual.','Present perfect pode destacar resultado presente.','',['She does not have her passport now','She found her passport yesterday','She has never had a passport']]
]);
unit('B1','Se isso, então aquilo','Explicar consequências e discutir possibilidades reais e hipotéticas.','Use if + presente, will para possibilidades reais; if + passado, would para hipóteses.','If I had more time, I would learn French.',[
['translate','Se chover, vamos ficar em casa.','If it rains we will stay at home|If it rains we will stay home|We will stay at home if it rains|We will stay home if it rains','Na oração com if, use presente para uma condição futura.','If + presente, will + verbo.'],
['gap','Complete com a forma de heat.','heat','Regras gerais usam presente nas duas orações.','Zero conditional: if + presente, presente.','If you ___ ice, it melts.'],
['transform','Una as frases com if no início.','If I had more time I would travel more','A hipótese contrária à situação atual usa passado e would.','If + passado, would + verbo.','I do not have much time. That is why I do not travel more.'],
['order','Monte o conselho.','If I were you I would ask','If I were you é uma estrutura convencional de conselho.','If I were you, I would…'],
['translate','Se você sair agora, vai pegar o trem.','If you leave now you will catch the train|You will catch the train if you leave now','Uma consequência futura possível usa will.','If + presente, will + verbo.'],
['gap','Complete com uma palavra.','would','Had marca uma condição hipotética.','Second conditional: would + verbo base.','If I had a bigger budget, I ___ hire an assistant.'],
['transform','Corrija a frase.','If I see her I will tell her','Não use will na oração de condição neste caso.','If + presente; will na oração principal.','If I will see her, I will tell her.'],
['choice','“If I lived closer, I would walk to work.” Qual é a implicação?','The speaker does not live close enough','A hipótese sugere uma situação diferente da atual.','Second conditional expressa distância da realidade.','',['The speaker walks to work every day','The speaker does not live close enough','The speaker is moving tomorrow']]
]);
unit('B1','Pedidos e soluções','Dar conselhos, explicar obrigações e fazer pedidos educados.','Should dá conselho; must expressa obrigação; do not have to significa que não é necessário.','You should rest. You do not have to work today.',[
['translate','Você deveria falar com seu gerente.','You should talk to your manager|You should speak to your manager|You should talk with your manager|You should speak with your manager','Should é seguido pelo verbo sem to.','Should + verbo base.'],
['gap','Complete: é proibido. Use must na negativa.','must not','Must not indica proibição, não ausência de obrigação.','Must not = não pode / é proibido.','You ___ share your password.'],
['transform','Reescreva usando do not have to.','You do not have to wear a suit','Não ser necessário é diferente de ser proibido.','Do not have to = não é necessário.','It is not necessary for you to wear a suit.'],
['order','Monte um pedido educado.','Could you send me the file please','Could you torna o pedido mais cortês.','Could you + verbo base?'],
['translate','Talvez cheguemos atrasados. Use might.','We might arrive late|We might be late','Might indica possibilidade, sem certeza.','Might + verbo base.'],
['gap','Complete com have.','have','Have to expressa uma obrigação ou exigência.','Have to + verbo base.','All passengers ___ to show their passports.'],
['transform','Corrija a frase.','You should check the details','Não use to depois de should.','Modal + verbo sem to.','You should to check the details.'],
['choice','“You do not have to attend, but you are welcome.” A presença é…','Optional','Do not have to torna a presença opcional.','Ausência de obrigação não é proibição.','',['Forbidden','Compulsory','Optional']]
]);
unit('B2','Notícias e perspectivas','Transmitir informações e relatar o que outras pessoas disseram.','Use the passive to focus on an action or its result; reported speech shifts the viewpoint.','The deadline was extended. She said she was available.',[
['translate','O voo foi cancelado ontem.','The flight was cancelled yesterday|The flight was canceled yesterday|Yesterday the flight was cancelled','The flight receives the action; both spelling variants are accepted.','Past passive: was/were + past participle.'],
['gap','Complete with the correct form of review.','being reviewed','The review is in progress and the proposal receives the action.','Present continuous passive: is/are being + participle.','The proposal is ___ by the board right now.'],
['transform','Report this statement. Begin: She said…','She said she was working from home|She said that she was working from home','The present continuous normally shifts to the past continuous in this reporting context.','Am/is/are working → was/were working.','She said yesterday: “I am working from home.”'],
['order','Build the reported question.','He asked where the station was','Reported questions use statement word order.','Asked + question word + subject + verb.'],
['translate','O relatório será enviado amanhã.','The report will be sent tomorrow|Tomorrow the report will be sent','The future passive focuses on the report.','Will be + past participle.'],
['gap','Complete with said or told.','told','Told takes a person as its direct object.','Tell someone something; say something.','She ___ me that the deadline had changed.'],
['transform','Rewrite in the passive. Keep the agent.','The project was approved by the team','The project becomes the subject; the team follows by.','Object → passive subject; by + agent.','The team approved the project.'],
['choice','“Visitors are advised to book in advance.” Which paraphrase is accurate?','Booking ahead is recommended','Are advised communicates a recommendation, not a compulsory rule.','Be advised to = be recommended to.','',['Booking ahead is recommended','Advance booking is prohibited','All visitors have already booked']]
]);
unit('B2','E se tivesse sido diferente?','Discutir consequências de acontecimentos passados e expressar arrependimento.','Use the third conditional for unreal past outcomes, and wish to express regret.','If I had known, I would have called.',[
['translate','Se eu soubesse, teria ajudado. A situação já passou.','If I had known I would have helped|I would have helped if I had known','Both the condition and its imagined result refer to the past.','If + past perfect, would have + participle.'],
['gap','Complete with the form of leave.','had left','An unreal past condition requires the past perfect.','If + had + participle.','If we ___ earlier, we would have caught the train.'],
['transform','Express regret using wish.','I wish I had accepted the offer','Wish + past perfect expresses regret about a completed past choice.','Wish + had + participle.','I did not accept the offer, and I regret it.'],
['order','Build the sentence.','I wish I had more time','The past form after wish describes an unreal present situation.','Wish + past simple for present wishes.'],
['translate','Eu teria ligado se tivesse seu número. Refira-se ao passado.','I would have called if I had had your number|If I had had your number I would have called','Had had is the past perfect of have.','Would have + participle; if + past perfect.'],
['gap','Complete with the form of tell.','had told','The regret is about not sharing the information earlier.','Wish + past perfect for past regrets.','I wish you ___ me about the delay yesterday.'],
['transform','Correct the conditional.','If I had studied I would have passed','In this conditional, would have belongs in the result clause.','If + had studied; would have passed.','If I would have studied, I would have passed.'],

function validateState(s){
 if(!s||typeof s!=='object'||s.version!==1||!integer(s.xp)||![30,60,100,150].includes(s.goal)||typeof s.muted!=='boolean'||!(s.placement===null||integer(s.placement,0,5)))throw Error('Código incompatível ou incompleto.');
 const r=fresh();r.xp=s.xp;r.goal=s.goal;r.muted=s.muted;r.placement=s.placement;
 for(const [key,len,max] of [['passes',18,2],['attempts',18,1000000]]){if(!Array.isArray(s[key])||s[key].length!==len||s[key].some(v=>!integer(v,0,max)))throw Error('Progresso de unidades inválido.');r[key]=s[key].slice();}
 if(!Array.isArray(s.bosses)||s.bosses.length!==6||s.bosses.some(v=>typeof v!=='boolean'))throw Error('Selos inválidos.');r.bosses=s.bosses.slice();
 for(const key of ['daily','days','errors','seen'])if(!s[key]||typeof s[key]!=='object'||Array.isArray(s[key]))throw Error('Dados ausentes no código.');
 for(const [k,v] of Object.entries(s.daily)){if(!validDate(k)||!integer(v))throw Error('Histórico diário inválido.');r.daily[k]=v;}
 for(const [k,v] of Object.entries(s.days)){if(!validDate(k)||v!==true)throw Error('Sequência inválida.');r.days[k]=true;}
 for(const [k,v] of Object.entries(s.seen)){if(!BY_ID[k]||!integer(v))throw Error('Histórico de itens inválido.');r.seen[k]=v;}
 for(const [k,v] of Object.entries(s.errors)){if(!BY_ID[k]||!v||!integer(v.count,1,1000000)||typeof v.answer!=='string'||v.answer.length>2000||!validDate(v.date))throw Error('Caderno de erros inválido.');r.errors[k]={count:v.count,answer:v.answer,date:v.date};}
 if(s.active!==null){const a=s.active;if(!a||!['session','boss','review','placement','practice'].includes(a.mode)||!Array.isArray(a.ids)||!a.ids.length||a.ids.length>18||a.ids.some(id=>!BY_ID[id])||new Set(a.ids).size!==a.ids.length||!integer(a.i,0,a.ids.length-1)||!integer(a.unit,0,17)||!integer(a.level,0,5)||!integer(a.correct,0,18)||!integer(a.combo,0,15)||!integer(a.xp,0,500)||!Array.isArray(a.answers)||a.answers.length!==a.i+(a.feedback?1:0))throw Error('Sessão salva inválida.');
  const answers=a.answers.map((v,j)=>{if(!v||v.id!==a.ids[j]||typeof v.correct!=='boolean'||typeof v.answer!=='string'||v.answer.length>2000||!integer(v.xp,0,15)||typeof v.skip!=='boolean')throw Error('Respostas da sessão inválidas.');return {id:v.id,answer:v.answer,correct:v.correct,xp:v.xp,skip:v.skip};});
  if(a.correct!==answers.filter(v=>v.correct).length||a.xp!==answers.reduce((n,v)=>n+v.xp,0))throw Error('Pontuação da sessão inconsistente.');

  if(a.mode==='placement'&&(a.ids.length!==(a.level+1)*3||a.level>5||a.ids.some((id,j)=>BY_ID[id].level!==LEVELS[Math.floor(j/3)])))throw Error('Nivelamento inválido.');

 }
 // Completed results are presentation only; executable/session state is validated above.
